<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <th:block th:fragment="styles">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <style>
            /* --- THEME VARIABLES --- */
            :root {
                --bg-color: #ffffff;
                --text-color: #343A40;
                --sidebar-bg: #F8F9FA;
                --sidebar-width: 250px; /* Full width */
                --sidebar-collapsed-width: 80px; /* Icon-only width */
                --card-bg: #ffffff;
                --border-color: #dee2e6;
                --ff-yellow: #FFC107;
            }

            /* DARK MODE OVERRIDES */
            [data-theme="dark"] {
                --bg-color: #212529;
                --text-color: #f8f9fa;
                --sidebar-bg: #1a1d20;
                --card-bg: #2c3034;
                --border-color: #495057;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-color);
                overflow-x: hidden;
                transition: all 0.3s;
            }

            /* --- SIDEBAR LOGIC (The "Mini" Mode) --- */
            #wrapper { display: flex; width: 100%; min-height: 100vh; }

            .sidebar {
                min-width: var(--sidebar-width);
                max-width: var(--sidebar-width);
                background-color: var(--sidebar-bg);
                border-right: 1px solid var(--border-color);
                transition: all 0.3s ease;
                display: flex;
                flex-direction: column;
                overflow: hidden; /* Hides text when shrinking */
                white-space: nowrap;
            }

            /* When Toggled: Shrink to 80px instead of hiding */
            #wrapper.toggled .sidebar {
                min-width: var(--sidebar-collapsed-width);
                max-width: var(--sidebar-collapsed-width);
            }

            /* Hide the Text Labels when toggled */
            #wrapper.toggled .sidebar .nav-link span,
            #wrapper.toggled .sidebar .sidebar-header h5,
            #wrapper.toggled .sidebar .btn-signout-text {
                display: none;
            }

            /* Center the icons when toggled */
            #wrapper.toggled .sidebar .nav-link,
            #wrapper.toggled .sidebar-header {
                justify-content: center;
                text-align: center;
                padding-left: 0;
                padding-right: 0;
            }

            #wrapper.toggled .sidebar .sidebar-logo {
                width: 40px; /* Smaller logo */
                margin-bottom: 0;
            }

            .sidebar .nav-link {
                color: var(--text-color);
                padding: 15px 20px;
                font-size: 1.1rem;
                display: flex;
                align-items: center;
                gap: 15px; /* Space between icon and text */
            }

            .sidebar .nav-link:hover, .sidebar .nav-link.active {
                background-color: var(--ff-yellow);
                color: black !important;
            }

            /* --- CONTENT --- */
            .main-content {
                width: 100%;
                padding: 20px;
                background-color: var(--bg-color);
            }

            /* --- DARK MODE TEXT FIXES (The "Invisible" Fix) --- */
            [data-theme="dark"] .table {
                color: white !important;
                --bs-table-color: white !important;
                --bs-table-bg: transparent !important;
            }
            /* Force Headers to be Yellow so they pop */
            [data-theme="dark"] .table thead th {
                color: var(--ff-yellow) !important;
                background-color: var(--card-bg) !important;
                border-bottom: 2px solid var(--border-color);
            }
            /* Fix "Muted" text to be visible light grey */
            [data-theme="dark"] .text-muted {
                color: #ced4da !important;
            }
            /* Card backgrounds */
            .card {
                background-color: var(--card-bg);
                color: var(--text-color);
                border: 1px solid var(--border-color);
            }
            /* Input fields */
            .form-control, .form-select {
                background-color: var(--card-bg);
                color: var(--text-color);
                border: 1px solid var(--border-color);
            }
            .form-control:focus, .form-select:focus {
                background-color: var(--card-bg);
                color: var(--text-color);
            }
            /* --- CALCULATOR STYLES --- */
            #calculatorModal {
                display: none; /* Hidden by default */
                position: fixed;
                top: 70px;
                right: 20px;
                z-index: 9999;
                background: var(--card-bg);
                border: 2px solid var(--ff-yellow);
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                width: 260px;
                padding: 15px;
            }
            .calc-screen {
                width: 100%;
                height: 50px;
                background-color: #222;
                color: #0f0; /* Retro Green Text */
                font-family: 'Courier New', monospace;
                font-size: 1.5rem;
                text-align: right;
                padding: 10px;
                border: none;
                border-radius: 5px;
                margin-bottom: 10px;
            }
            .calc-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
            }
            .btn-calc {
                padding: 15px;
                font-weight: bold;
                border-radius: 5px;
                border: 1px solid var(--border-color);
                background-color: var(--bg-color);
                color: var(--text-color);
            }
            .btn-calc:hover { background-color: var(--ff-yellow); color: black; }
            .btn-calc.operator { background-color: #f0f0f0; color: black; }
            .btn-calc.equal { background-color: var(--ff-yellow); grid-column: span 2; }
            .btn-calc.clear { background-color: #ff6b6b; color: white; grid-column: span 2; }
            /* --- HOVER FIXES FOR DARK MODE --- */

            /* 1. Fix Table Row Hover (Make it dark grey, not white) */
            [data-theme="dark"] .table-hover tbody tr:hover {
                background-color: #343a40 !important; /* Lighter Grey */
                color: #ffffff !important;            /* Keep text White */
            }

            /* 2. Fix Outline Buttons on Hover (Force Black text on fill) */
            [data-theme="dark"] .btn-outline-light:hover,
            [data-theme="dark"] .btn-outline-dark:hover,
            [data-theme="dark"] .btn-outline-primary:hover {
                color: #000000 !important; /* Turn text black when button fills with color */
            }

            /* 3. Fix Standard Links (Make them Yellow/Bright on hover) */
            [data-theme="dark"] a:hover {
                color: var(--ff-yellow) !important;
            }

            /* 4. Fix Dropdown/Select Menu Items */
            [data-theme="dark"] select option {
                background-color: #2c3034;
                color: white;
            }
            /* --- CHAT STYLES --- */
            #chatButton {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background-color: var(--ff-yellow);
                border: none;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
                z-index: 9999;
                font-size: 24px;
                color: black;
            }
            #chatBox {
                display: none;
                position: fixed;
                bottom: 90px;
                right: 20px;
                width: 320px;
                height: 400px;
                background-color: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                z-index: 9999;
                flex-direction: column;
            }
            .chat-history {
                flex-grow: 1;
                overflow-y: auto;
                padding: 15px;
                display: flex;
                flex-direction: column-reverse; /* Newest at bottom visually */
                gap: 10px;
            }
            .chat-msg {
                padding: 8px 12px;
                border-radius: 10px;
                max-width: 80%;
                font-size: 0.9rem;
            }
            .msg-me { align-self: flex-end; background-color: var(--ff-yellow); color: black; }
            .msg-other { align-self: flex-start; background-color: #e9ecef; color: black; }

            /* --- FIX INVISIBLE BUTTONS IN DARK MODE --- */
            [data-theme="dark"] .btn-outline-dark {
                color: #f8f9fa !important;       /* White Text */
                border-color: #f8f9fa !important; /* White Border */
            }
            [data-theme="dark"] .btn-outline-dark:hover {
                background-color: #f8f9fa !important; /* White Fill */
                color: black !important;              /* Black Text */
            }

            /* --- SIDEBAR TOGGLE FIXES --- */

            /* 1. Hide Clock when Toggled */
            #wrapper.toggled #liveClockWidget {
                display: none !important;
            }

            /* 2. Fix Team Hub Icon Alignment when Toggled */
            #wrapper.toggled .nav-link {
                justify-content: center !important; /* Center the icon */
                padding-left: 0 !important;
                padding-right: 0 !important;
            }

            /* 3. Hide the text container inside the link when toggled */
            #wrapper.toggled .nav-link .link-text-container {
                display: none !important;
            }

            /* Hide Profile Text when Sidebar is Toggled */
            #wrapper.toggled .profile-text-container {
                display: none !important;
            }
            #wrapper.toggled .profile-icon-container {
                margin: 0 auto; /* Center the icon */
            }
        </style>

        <script>
            function toggleSidebar() {
                document.getElementById("wrapper").classList.toggle("toggled");
            }

            function toggleDarkMode() {
                const current = document.documentElement.getAttribute("data-theme");
                const next = current === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("theme", next);
            }

            document.addEventListener("DOMContentLoaded", function() {
                const saved = localStorage.getItem("theme") || "light";
                document.documentElement.setAttribute("data-theme", saved);
            });
            function toggleCalculator() {
                var calc = document.getElementById("calculatorModal");
                if (calc.style.display === "block") {
                    calc.style.display = "none";
                } else {
                    calc.style.display = "block";
                }
            }

            function appendCalc(val) {
                document.getElementById("calcDisplay").value += val;
            }

            function clearCalc() {
                document.getElementById("calcDisplay").value = "";
            }

            function calculateResult() {
                try {
                    // Evaluate the math string
                    var result = eval(document.getElementById("calcDisplay").value);
                    document.getElementById("calcDisplay").value = result;
                } catch (e) {
                    document.getElementById("calcDisplay").value = "Error";
                }
            }
            // --- LIVE CLOCK LOGIC ---
            function updateClock() {
                const now = new Date();
                // Format Time (e.g., 14:30:45)
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                // Format Date (e.g., Mon, 4 Dec 2025)
                const dateString = now.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

                // Update HTML (Check if element exists first)
                const timeEl = document.getElementById("liveTime");
                const dateEl = document.getElementById("liveDate");

                if (timeEl) timeEl.innerText = timeString;
                if (dateEl) dateEl.innerText = dateString;
            }

            // Run immediately, then update every second
            document.addEventListener("DOMContentLoaded", function() {
                updateClock();
                setInterval(updateClock, 1000);
            });

            // 1. Permission Check
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            // 2. Poll the server every 5 seconds
            setInterval(function() {
                fetch('/api/check-latest-message')
                    .then(response => response.json())
                    .then(data => {
                        // If there is no message, stop.
                        if (data.id === 0) return;

                        // 3. Check if this is a NEW message
                        // We store the ID of the last message we saw in the browser's memory
                        let lastSeenId = localStorage.getItem("lastMessageId");

                        // If the ID from server is bigger than the one we have stored...
                        if (lastSeenId == null || data.id > parseInt(lastSeenId)) {

                            // 4. IT'S NEW! Show the notification
                            showChatNotification(data.sender, data.content);

                            // Update our memory so we don't notify again for the same message
                            localStorage.setItem("lastMessageId", data.id);
                        }
                    })
                    .catch(err => console.error("Chat check failed", err));
            }, 5000); // Check every 5 seconds

            function showChatNotification(sender, content) {
                if (Notification.permission === "granted") {
                    // Customize the notification
                    const notification = new Notification("New Message from " + sender, {
                        body: content,
                        icon: "/images/logo.png" // Make sure this path exists
                    });

                    // Optional: When admin clicks the popup, take them to the chat
                    notification.onclick = function() {
                        window.location.href = "/team-hub"; // Or your chat URL
                    };
                }
            }

        </script>
    </th:block>
</head>
<body>

<div th:fragment="sidebar" class="sidebar">
    <div class="sidebar-header p-3 d-flex flex-column align-items-center">
        <img th:src="@{/images/logo-icon.png}" alt="Logo" class="sidebar-logo" style="width: 50px; transition: all 0.3s;">
        <h5 class="fw-bold mt-2 mb-0 text-truncate" style="color: var(--ff-yellow);">Fruity Fusion</h5>

        <div id="liveClockWidget" class="mt-2 text-center small text-muted">
            <div id="liveTime">--:--</div>
            <div id="liveDate">---</div>
        </div>
    </div>

    <ul class="nav nav-pills flex-column mb-auto mt-3">

        <li class="nav-item">
            <a href="/" class="nav-link" th:classappend="${activePage == 'home'} ? 'active' : ''">
                <i class="fas fa-home" title="Dashboard"></i> <span>Dashboard</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="/products" class="nav-link" th:classappend="${activePage == 'inventory'} ? 'active' : ''">
                <i class="fas fa-glass-water" title="Inventory"></i> <span>Inventory / POS</span>
            </a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a href="/expenses" class="nav-link" th:classappend="${activePage == 'expenses'} ? 'active' : ''">
                <i class="fas fa-receipt" title="Expenses"></i> <span>Expenses</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="/sales" class="nav-link" th:classappend="${activePage == 'sales'} ? 'active' : ''">
                <i class="fas fa-chart-line" title="Sales"></i> <span>Sales History</span>
            </a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a href="/analytics" class="nav-link" th:classappend="${activePage == 'analytics'} ? 'active' : ''">
                <i class="fas fa-chart-pie" title="Financial Review"></i> <span>Financial Review</span>
            </a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a href="/income-statement" class="nav-link" th:classappend="${activePage == 'income'} ? 'active' : ''">
                <i class="fas fa-file-invoice-dollar" title="P&L Report"></i> <span>Income Statement</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="/team" class="nav-link" th:classappend="${activePage == 'team'} ? 'active' : ''" onclick="markMessagesAsRead()">
                <div class="d-flex align-items-center w-100 justify-content-between">
                    <div>
                        <i class="fas fa-users" title="Team Hub"></i>
                        <span class="ms-2">Team Hub</span>
                    </div>

                    <span id="navRedDot"
                          class="badge bg-danger rounded-circle p-1"
                          style="width: 10px; height: 10px; display: none;">
                <span class="visually-hidden">New alerts</span>
            </span>
                </div>
            </a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a href="/users" class="nav-link" th:classappend="${activePage == 'users'} ? 'active' : ''">
                <i class="fas fa-user-cog" title="Manage Staff"></i> <span>Manage Staff</span>
            </a>
        </li>
    </ul>

    <div class="p-3 mt-auto">
        <div class="d-flex align-items-center gap-3 mb-3 px-2 py-2 rounded profile-container"
             style="background-color: rgba(0,0,0,0.05);">

            <div class="profile-icon-container rounded-circle bg-warning d-flex align-items-center justify-content-center"
                 style="width: 40px; height: 40px; font-size: 1.2rem; color: black; flex-shrink: 0;">
                <i class="fas fa-user"></i>
            </div>

            <div class="profile-text-container" style="line-height: 1.2; overflow: hidden;">
                <small class="d-block text-muted" style="font-size: 0.7rem;">Logged in as</small>
                <strong style="color: var(--text-color);" sec:authentication="name">User</strong>
            </div>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger w-100 fw-bold d-flex justify-content-center align-items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> <span class="btn-signout-text">Sign Out</span>
            </button>
        </form>
    </div>
</div>

<div th:fragment="topbar" class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom position-relative">
    <button class="btn btn-link text-decoration-none" style="font-size: 1.5rem; color: var(--text-color);" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="d-flex gap-3">
        <button class="btn btn-link text-decoration-none" style="font-size: 1.5rem; color: var(--text-color);" onclick="toggleCalculator()">
            <i class="fas fa-calculator"></i>
        </button>

        <button class="btn btn-link text-decoration-none" style="font-size: 1.5rem; color: var(--text-color);" onclick="toggleDarkMode()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div id="calculatorModal">
        <input type="text" id="calcDisplay" class="calc-screen" readonly value="">
        <div class="calc-grid">
            <button class="btn-calc clear" onclick="clearCalc()">C</button>
            <button class="btn-calc" onclick="appendCalc('/')">÷</button>
            <button class="btn-calc" onclick="appendCalc('*')">×</button>

            <button class="btn-calc" onclick="appendCalc('7')">7</button>
            <button class="btn-calc" onclick="appendCalc('8')">8</button>
            <button class="btn-calc" onclick="appendCalc('9')">9</button>
            <button class="btn-calc operator" onclick="appendCalc('-')">-</button>

            <button class="btn-calc" onclick="appendCalc('4')">4</button>
            <button class="btn-calc" onclick="appendCalc('5')">5</button>
            <button class="btn-calc" onclick="appendCalc('6')">6</button>
            <button class="btn-calc operator" onclick="appendCalc('+')">+</button>

            <button class="btn-calc" onclick="appendCalc('1')">1</button>
            <button class="btn-calc" onclick="appendCalc('2')">2</button>
            <button class="btn-calc" onclick="appendCalc('3')">3</button>
            <button class="btn-calc equal" onclick="calculateResult()">=</button>

            <button class="btn-calc" onclick="appendCalc('0')">0</button>
            <button class="btn-calc" onclick="appendCalc('.')">.</button>
        </div>
    </div>
</div>

<script>
    // --- RED DOT NOTIFICATION LOGIC ---

    // 1. Run immediately, then every 4 seconds
    checkNotifications();
    setInterval(checkNotifications, 4000);

    function checkNotifications() {
        // Stop if we are on the Team Hub page (no need to alert)
        if (window.location.pathname.includes('/team')) {
            document.getElementById('navRedDot').style.display = 'none';
            return;
        }

        fetch('/api/check-latest-message')
            .then(response => response.json())
            .then(data => {
                // Convert to Numbers to be safe
                let serverId = Number(data.id) || 0;
                let localId = Number(localStorage.getItem('lastReadMessageId')) || 0;

                // Debugging (Press F12 to see this)
                // console.log("Server ID:", serverId, "Local ID:", localId);

                if (serverId > localId) {
                    // New Message detected!
                    document.getElementById('navRedDot').style.display = 'inline-block';
                } else {
                    document.getElementById('navRedDot').style.display = 'none';
                }
            })
            .catch(err => console.error("Red Dot Error:", err));
    }

    // 2. Click Handler (Attached to the Link)
    function markMessagesAsRead() {
        // Hide dot instantly
        document.getElementById('navRedDot').style.display = 'none';

        // Fetch latest ID and save it as "Read"
        fetch('/api/check-latest-message')
            .then(res => res.json())
            .then(data => {
                localStorage.setItem('lastReadMessageId', data.id);
            });
    }
</script>

</body>
</html>
