<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <th:block th:fragment="styles">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <style>
            /* --- THEME VARIABLES --- */
            :root {
                --bg-color: #ffffff;
                --text-color: #343A40;
                --sidebar-bg: #F8F9FA;
                --sidebar-width: 250px;
                --sidebar-collapsed-width: 80px;
                --card-bg: #ffffff;
                --border-color: #dee2e6;
                --ff-yellow: #FFC107;
            }

            /* DARK MODE OVERRIDES */
            [data-theme="dark"] {
                --bg-color: #212529;
                --text-color: #f8f9fa;
                --sidebar-bg: #1a1d20;
                --card-bg: #2c3034;
                --border-color: #495057;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-color);
                overflow-x: hidden;
                transition: all 0.3s;
            }

            /* --- SIDEBAR LOGIC --- */
            #wrapper { display: flex; width: 100%; min-height: 100vh; }

            .sidebar {
                min-width: var(--sidebar-width);
                max-width: var(--sidebar-width);
                background-color: var(--sidebar-bg);
                border-right: 1px solid var(--border-color);
                transition: all 0.3s ease;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                white-space: nowrap;
                height: 100vh;
                position: sticky;
                top: 0;
            }

            #wrapper.toggled .sidebar {
                min-width: var(--sidebar-collapsed-width);
                max-width: var(--sidebar-collapsed-width);
            }

            /* Hide Text When Toggled */
            #wrapper.toggled .sidebar .nav-link span,
            #wrapper.toggled .sidebar .sidebar-header h5,
            #wrapper.toggled .sidebar .btn-signout-text,
            #wrapper.toggled .profile-text-container,
            #wrapper.toggled #liveClockWidget {
                display: none !important;
            }

            /* Center Icons When Toggled */
            #wrapper.toggled .sidebar .nav-link {
                justify-content: center;
                padding: 15px 5px;
            }
            #wrapper.toggled .sidebar .sidebar-logo { width: 40px; margin-bottom: 0; }
            #wrapper.toggled .profile-icon-container { margin: 0 auto; }

            /* Fix Team Hub Icon alignment */
            #wrapper.toggled .sidebar .nav-link .d-flex {
                justify-content: center !important;
                width: 100%;
            }
            #wrapper.toggled .sidebar .nav-link #navRedDot { display: none !important; }

            .sidebar .nav-link {
                color: var(--text-color);
                padding: 15px 20px;
                font-size: 1.1rem;
                display: flex;
                align-items: center;
                gap: 15px;
            }
            .sidebar .nav-link:hover, .sidebar .nav-link.active {
                background-color: var(--ff-yellow);
                color: black !important;
            }

            /* --- CONTENT --- */
            .main-content { width: 100%; padding: 20px; background-color: var(--bg-color); }

            /* --- DARK MODE FIXES --- */
            [data-theme="dark"] .table { color: white !important; background-color: var(--card-bg); }
            [data-theme="dark"] .table td, [data-theme="dark"] .table th { background-color: transparent; border-color: var(--border-color); color: white; }
            [data-theme="dark"] .text-muted { color: #ced4da !important; }
            [data-theme="dark"] .card, [data-theme="dark"] .form-control, [data-theme="dark"] .form-select {
                background-color: var(--card-bg);
                color: var(--text-color);
                border-color: var(--border-color);
            }
            [data-theme="dark"] ::placeholder { color: #adb5bd !important; opacity: 1; }

            /* --- THEME SWITCH --- */
            .theme-switch {
                width: 60px; height: 30px; background-color: #343a40; border-radius: 30px; position: relative; cursor: pointer;
                display: flex; align-items: center; justify-content: space-between; padding: 0 5px; border: 1px solid var(--border-color);
            }
            .theme-switch i { font-size: 14px; z-index: 1; }
            .theme-switch .fa-sun { color: #ffc107; margin-left: 3px; }
            .theme-switch .fa-moon { color: #f8f9fa; margin-right: 3px; }
            .theme-switch .ball {
                position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; background-color: white; border-radius: 50%;
                transition: transform 0.3s ease; z-index: 2;
            }
            [data-theme="dark"] .theme-switch .ball { transform: translateX(30px); background-color: var(--ff-yellow); }

            /* --- CALCULATOR MODAL STYLES --- */
            .calc-btn { width: 100%; height: 50px; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
            .calc-display { background: #222; color: #0f0; font-family: 'Courier New', monospace; font-size: 2rem; text-align: right; border: none; }

            /* --- PROFIT COLORS --- */
            [data-theme="dark"] .table-bordered .text-success { color: #2ecc71 !important; }
            [data-theme="dark"] .table-bordered .text-danger { color: #ff6b6b !important; }
            [data-theme="dark"] tfoot tr { background-color: var(--card-bg) !important; color: white; }
        </style>
    </th:block>
</head>
<body>

<div th:fragment="sidebar" class="sidebar">
    <div class="sidebar-header p-3 d-flex flex-column align-items-center">
        <img th:src="@{/images/logo-icon.png}" alt="Logo" class="sidebar-logo" style="width: 50px; transition: all 0.3s;">
        <h5 class="fw-bold mt-2 mb-0 text-truncate" style="color: var(--ff-yellow);">Fruity Fusion</h5>
        <div id="liveClockWidget" class="mt-2 text-center small text-muted">
            <div id="liveTime">--:--</div>
            <div id="liveDate">---</div>
        </div>
    </div>

    <ul class="nav nav-pills flex-column mb-auto mt-3">
        <li class="nav-item"><a href="/" class="nav-link" th:classappend="${activePage == 'home'} ? 'active' : ''"><i class="fas fa-home"></i> <span>Dashboard</span></a></li>
        <li class="nav-item"><a href="/products" class="nav-link" th:classappend="${activePage == 'inventory'} ? 'active' : ''"><i class="fas fa-glass-water"></i> <span>Inventory / POS</span></a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a href="/expenses" class="nav-link" th:classappend="${activePage == 'expenses'} ? 'active' : ''"><i class="fas fa-receipt"></i> <span>Expenses</span></a></li>
        <li class="nav-item"><a href="/sales" class="nav-link" th:classappend="${activePage == 'sales'} ? 'active' : ''"><i class="fas fa-chart-line"></i> <span>Sales History</span></a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a href="/analytics" class="nav-link" th:classappend="${activePage == 'analytics'} ? 'active' : ''"><i class="fas fa-chart-pie"></i> <span>Financial Review</span></a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a href="/income-statement" class="nav-link" th:classappend="${activePage == 'income'} ? 'active' : ''"><i class="fas fa-file-invoice-dollar"></i> <span>Income Statement</span></a></li>
        <li class="nav-item">
            <a href="/team" class="nav-link" th:classappend="${activePage == 'team'} ? 'active' : ''" onclick="markMessagesAsRead()">
                <div class="d-flex align-items-center w-100 justify-content-between">
                    <div><i class="fas fa-users"></i><span class="ms-2">Team Hub</span></div>
                    <span id="navRedDot" class="badge bg-danger rounded-circle p-1" style="width: 10px; height: 10px; display: none;"></span>
                </div>
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a href="/users" class="nav-link" th:classappend="${activePage == 'users'} ? 'active' : ''"><i class="fas fa-user-cog"></i> <span>Manage Staff</span></a></li>
    </ul>

    <div class="p-3 mt-auto border-top border-secondary">
        <div class="d-flex align-items-center gap-3 mb-3 px-2 py-2 rounded profile-container" style="background-color: rgba(0,0,0,0.05);">
            <div class="profile-icon-container rounded-circle bg-warning d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; color: black; flex-shrink: 0;"><i class="fas fa-user"></i></div>
            <div class="profile-text-container" style="line-height: 1.2; overflow: hidden;">
                <small class="d-block text-muted" style="font-size: 0.7rem;">Logged in as</small>
                <strong style="color: var(--text-color);" sec:authentication="name">User</strong>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger w-100 fw-bold d-flex justify-content-center align-items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> <span class="btn-signout-text">Sign Out</span>
            </button>
        </form>
    </div>
</div>

<div th:fragment="topbar">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom position-relative">
        <button class="btn btn-link text-decoration-none" style="font-size: 1.5rem; color: var(--text-color);" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>

        <div class="d-flex gap-3 align-items-center">
            <button type="button" class="btn btn-link text-decoration-none" style="font-size: 1.5rem; color: var(--text-color);" onclick="openCalculator()">
                <i class="fas fa-calculator"></i>
            </button>

            <div class="theme-switch" onclick="toggleDarkMode()" title="Toggle Theme">
                <i class="fas fa-sun"></i>
                <div class="ball"></div>
                <i class="fas fa-moon"></i>
            </div>
        </div>
    </div>

    <div class="modal fade" id="calculatorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-warning"><i class="fas fa-calculator"></i> Calculator</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="calcDisplay" class="form-control calc-display mb-3" readonly>
                    <div class="row g-2">
                        <div class="col-3"><button class="btn btn-danger calc-btn" onclick="clearCalc()">C</button></div>
                        <div class="col-3"><button class="btn btn-secondary calc-btn" onclick="backspaceCalc()"><i class="fas fa-backspace"></i></button></div>
                        <div class="col-3"><button class="btn btn-secondary calc-btn" onclick="appendCalc('/')">÷</button></div>
                        <div class="col-3"><button class="btn btn-secondary calc-btn" onclick="appendCalc('*')">×</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('7')">7</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('8')">8</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('9')">9</button></div>
                        <div class="col-3"><button class="btn btn-secondary calc-btn" onclick="appendCalc('-')">-</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('4')">4</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('5')">5</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('6')">6</button></div>
                        <div class="col-3"><button class="btn btn-secondary calc-btn" onclick="appendCalc('+')">+</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('1')">1</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('2')">2</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('3')">3</button></div>
                        <div class="col-3"><button class="btn btn-warning calc-btn text-dark" style="height: 100%;" onclick="calculateResult()">=</button></div>
                        <div class="col-6"><button class="btn btn-dark calc-btn" onclick="appendCalc('0')">0</button></div>
                        <div class="col-3"><button class="btn btn-dark calc-btn" onclick="appendCalc('.')">.</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. SIDEBAR TOGGLE
        function toggleSidebar() { document.getElementById("wrapper").classList.toggle("toggled"); }

        // 2. THEME LOGIC
        function toggleDarkMode() {
            const current = document.documentElement.getAttribute("data-theme");
            const next = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        }

        document.addEventListener("DOMContentLoaded", function() {
            const saved = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", saved);
            if(typeof updateClock === "function") { updateClock(); setInterval(updateClock, 1000); }
        });

        // 3. CALCULATOR LOGIC
        let calcModal = null;
        function openCalculator() {
            const el = document.getElementById('calculatorModal');
            if(!calcModal) { calcModal = new bootstrap.Modal(el); }
            calcModal.show();
        }
        function appendCalc(val) { document.getElementById("calcDisplay").value += val; }
        function clearCalc() { document.getElementById("calcDisplay").value = ""; }
        function backspaceCalc() {
            let d = document.getElementById("calcDisplay");
            d.value = d.value.toString().slice(0, -1);
        }
        function calculateResult() {
            try { document.getElementById("calcDisplay").value = eval(document.getElementById("calcDisplay").value); }
            catch { document.getElementById("calcDisplay").value = "Error"; }
        }

        // 4. CLOCK
        function updateClock() {
            const now = new Date();
            const tEl = document.getElementById("liveTime");
            const dEl = document.getElementById("liveDate");
            if(tEl) tEl.innerText = now.toLocaleTimeString();
            if(dEl) dEl.innerText = now.toLocaleDateString();
        }

        // 5. RED DOT LOGIC
        setInterval(function() {
            if (window.location.pathname.includes('/team')) return;
            fetch('/api/check-latest-message')
                .then(r => r.json())
                .then(d => {
                    let sId = Number(d.id) || 0;
                    let lId = Number(localStorage.getItem('lastReadMessageId')) || 0;
                    let dot = document.getElementById('navRedDot');
                    if(dot) dot.style.display = (sId > lId) ? 'inline-block' : 'none';
                }).catch(e => console.log(e));
        }, 4000);

        function markMessagesAsRead() {
            let dot = document.getElementById('navRedDot');
            if(dot) dot.style.display = 'none';
            fetch('/api/check-latest-message').then(r => r.json())
                .then(d => localStorage.setItem('lastReadMessageId', d.id));
        }
    </script>
</div>

</body>
</html>
