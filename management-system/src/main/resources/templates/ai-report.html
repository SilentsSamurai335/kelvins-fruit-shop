<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Financial Report - Fruity Fusion</title>
    <!-- Assuming you use standard Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #212529; color: #f8f9fa; }
        .card { background-color: #2c3034; border: 1px solid #495057; }
        .text-warning { color: #ffc107 !important; }
        .ai-content { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.6; }
        #loadingSpinner { display: none; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Add your sidebar fragment here if you use one -->
        <!-- <div th:replace="~{fragments :: sidebar('ai-report')}"></div> -->

        <div class="col-md-9 col-lg-10 p-4 mx-auto" id="main-content">
            <h2 class="mb-4 text-warning"><i class="fas fa-robot me-2"></i>AI Financial Analyst</h2>

            <!-- 1. The Time Filter Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/ai-report}" method="get" class="d-flex align-items-center gap-3" onsubmit="showLoading()">
                        <label class="fw-bold mb-0">Select Timeframe:</label>
                        <select name="period" class="form-select w-auto bg-dark text-light border-secondary">
                            <option value="today" th:selected="${currentPeriod == 'today'}">Today</option>
                            <option value="week" th:selected="${currentPeriod == 'week'}">This Week</option>
                            <option value="month" th:selected="${currentPeriod == 'month'}">This Month</option>
                            <option value="year" th:selected="${currentPeriod == 'year'}">This Year</option>
                            <option value="all" th:selected="${currentPeriod == 'all'}">All Time</option>
                        </select>
                        <button type="submit" class="btn btn-warning fw-bold">Generate Report</button>
                    </form>
                </div>
            </div>

            <!-- 2. Loading Animation (Hidden by default) -->
            <div id="loadingSpinner" class="text-center my-5">
                <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div>
                <h5 class="mt-3 text-muted">Gemini AI is analyzing your ingredient costs...</h5>
            </div>

            <!-- 3. The AI Report Output -->
            <div class="card shadow-lg" id="reportContainer" th:if="${aiResponse != null}">
                <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-chart-line me-2"></i>Analysis for: <span th:text="${timeFrameLabel}"></span></span>
                    <button onclick="window.print()" class="btn btn-sm btn-dark"><i class="fas fa-print"></i> Print</button>
                </div>
                <div class="card-body p-4">
                    <!-- The raw text from Gemini -->
                    <div class="ai-content text-light" th:text="${aiResponse}"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function showLoading() {
        // Hide the report container if it exists, show the spinner
        let reportContainer = document.getElementById('reportContainer');
        if (reportContainer) { reportContainer.style.display = 'none'; }
        document.getElementById('loadingSpinner').style.display = 'block';
    }
</script>
</body>
</html>
