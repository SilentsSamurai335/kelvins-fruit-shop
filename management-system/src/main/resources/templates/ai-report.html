<!DOCTYPE html>
<!-- FIX 1: Added data-bs-theme="dark" to force Bootstrap into dark mode -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>AI Financial Report - Fruity Fusion</title>
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Include your fragments stylesheet if you have one -->
    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        /* Dark Theme Styles */
        body { background-color: #212529; color: #f8f9fa; overflow-x: hidden; }
        .card { background-color: #2c3034; border: 1px solid #495057; }
        .text-warning { color: #ffc107 !important; }
        .ai-content { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.6; }
        #loadingSpinner { display: none; }

        /* Print Formatting */
        @media print {
            #sidebar-wrapper, .d-print-none { display: none !important; }
            .main-content { width: 100% !important; margin: 0 !important; }
            .bg-dark, .card { background-color: #ffffff !important; border: 1px solid #dee2e6 !important; }
            .text-light { color: #000000 !important; }
            .text-muted { color: #6c757d !important; }
            .text-warning { color: #000000 !important; }
            .badge { border: 1px solid #000; color: #000; }
            .col-lg-7, .col-lg-5 { width: 100% !important; margin-bottom: 20px; } /* Stack vertically for printing */
        }
    </style>
</head>
<body>

<div class="d-flex" id="wrapper">
    <!-- 1. Include Sidebar -->
    <div th:replace="~{fragments :: sidebar(activePage='ai-report')}"></div>

    <!-- FIX 2: Added bg-dark and min-vh-100 to ensure the background covers the whole screen -->
    <div class="main-content w-100 bg-dark min-vh-100">
        <div th:replace="~{fragments :: topbar}"></div>

        <div class="container-fluid py-4">

            <!-- 2. Header & Print Button -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0 text-warning"><i class="fas fa-robot me-2"></i>AI Financial Analyst</h2>
                <button onclick="window.print()" class="btn btn-secondary d-print-none">
                    <i class="fas fa-print"></i> Print / PDF
                </button>
            </div>

            <!-- 3. Independent Filters -->
            <div class="d-flex flex-wrap gap-3 mb-4 d-print-none">
                <form th:action="@{/ai-report}" method="get" onsubmit="showLoading()">
                    <label class="form-label text-light small mb-1">Specific Month</label>
                    <div class="input-group">
                        <input type="month" name="specificMonth" class="form-control bg-dark text-light border-secondary">
                        <button type="submit" class="btn btn-warning fw-bold"><i class="fas fa-filter"></i> Apply Month</button>
                    </div>
                </form>

                <form th:action="@{/ai-report}" method="get" onsubmit="showLoading()">
                    <label class="form-label text-light small mb-1">Specific Year</label>
                    <div class="input-group">
                        <input type="number" name="specificYear" class="form-control bg-dark text-light border-secondary" placeholder="YYYY" min="2020" max="2100">
                        <button type="submit" class="btn btn-warning fw-bold"><i class="fas fa-filter"></i> Apply Year</button>
                    </div>
                </form>

                <form th:action="@{/ai-report}" method="get" onsubmit="showLoading()">
                    <label class="form-label d-block mb-1">&nbsp;</label>
                    <input type="hidden" name="period" value="all">
                    <button type="submit" class="btn btn-warning fw-bold"><i class="fas fa-globe"></i> All Time</button>
                </form>
            </div>

            <!-- 4. KPI Summary Cards -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase fw-bold mb-1">Total Sales</h6>
                            <h3 class="text-success mb-0">KES <span th:text="${#numbers.formatDecimal(totalSales != null ? totalSales : 0, 1, 'COMMA', 2, 'POINT')}">0.00</span></h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase fw-bold mb-1">Total Expenses</h6>
                            <h3 class="text-danger mb-0">KES <span th:text="${#numbers.formatDecimal(totalExpenses != null ? totalExpenses : 0, 1, 'COMMA', 2, 'POINT')}">0.00</span></h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase fw-bold mb-1">Net Profit</h6>
                            <h3 class="text-primary mb-0">KES <span th:text="${#numbers.formatDecimal(netProfit != null ? netProfit : 0, 1, 'COMMA', 2, 'POINT')}">0.00</span></h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase fw-bold mb-1">Profit Margin</h6>
                            <h3 class="text-info mb-0"><span th:text="${profitMargin != null ? profitMargin : '0.0'}">0.0</span>%</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. Content Row: Graph and AI Analysis side-by-side -->
            <div class="row">
                <!-- Trend Graph Container -->
                <div class="col-lg-7 mb-4">
                    <div class="card shadow-lg h-100">
                        <div class="card-header bg-dark text-light border-secondary fw-bold">
                            <i class="fas fa-chart-bar me-2 text-primary"></i>Revenue vs. Expenses Overview
                        </div>
                        <div class="card-body p-4 bg-dark">
                            <canvas id="comparisonChart" style="min-height: 300px;"></canvas>                        </div>
                    </div>
                </div>

                <!-- AI Generated Text Container -->
                <div class="col-lg-5 mb-4">
                    <div class="card shadow-lg h-100">
                        <div class="card-header bg-warning text-dark fw-bold">
                            <i class="fas fa-magic me-2"></i>Gemini Insights
                        </div>
                        <div class="card-body p-4 bg-dark text-light position-relative">

                            <!-- Loading Spinner inside the card (Visible by default) -->
                            <div id="loadingSpinner" class="text-center my-5">
                                <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div>
                                <h5 class="mt-3 text-muted">Gemini AI is analyzing your financial data...</h5>
                            </div>

                            <!-- The container for the AI text (Hidden by default) -->
                            <div id="reportContainer" class="ai-content" style="display: none;">

                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- JS Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- FIX 3: Include your global Javascript to ensure the sidebar clock works -->
<!-- If you use a fragments file for scripts, uncomment the line below: -->
<!-- <th:block th:replace="~{fragments :: scripts}"></th:block> -->
<script th:inline="javascript">
    // 1. Fetch totals safely from Spring Boot Model
    const rawRevenue = /*[[${totalSales != null ? totalSales : (totalRevenue != null ? totalRevenue : 0)}]]*/ 0;
    const rawExpenses = /*[[${totalExpenses != null ? totalExpenses : 0}]]*/ 0;

    // 2. Target the exact canvas ID we created
    const ctx = document.getElementById('comparisonChart').getContext('2d');

    // 3. Build the Comparative Bar Chart
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Overview (Selected Period)'],
            datasets: [
                {
                    label: 'Gross Revenue (KES)',
                    data: [rawRevenue],
                    backgroundColor: '#28a745', // Green for Revenue
                    borderRadius: 4,
                    barPercentage: 0.6,
                    categoryPercentage: 0.8
                },
                {
                    label: 'Total Expenses (KES)',
                    data: [rawExpenses],
                    backgroundColor: '#dc3545', // Red for Expenses
                    borderRadius: 4,
                    barPercentage: 0.6,
                    categoryPercentage: 0.8
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: { color: '#adb5bd' } // Light text for dark mode
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: '#495057' },
                    ticks: {
                        color: '#adb5bd',
                        callback: function(value) { return value.toLocaleString(); }
                    }
                },
                x: {
                    grid: { display: false },
                    ticks: { color: '#adb5bd' }
                }
            }
        }
    });
</script>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Grab the variables calculated by the main page load
        const timeFrame = /*[[${timeFrameLabel}]]*/ 'All Time';
        const sales = /*[[${totalSales != null ? totalSales : 0}]]*/ 0;
        const expenses = /*[[${totalExpenses != null ? totalExpenses : 0}]]*/ 0;

        // 2. Fetch the AI analysis in the background
        fetch(`/api/generate-insights?timeFrameLabel=${encodeURIComponent(timeFrame)}&totalSales=${sales}&totalExpenses=${expenses}`)
            .then(response => response.text())
            .then(text => {
                // 3. Hide the spinner and show the text
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('reportContainer').innerText = text;
                document.getElementById('reportContainer').style.display = 'block';
            })
            .catch(error => {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('reportContainer').innerText = "Failed to connect to the AI service.";
                document.getElementById('reportContainer').style.display = 'block';
            });
    });
</script>
</body>
</html>
