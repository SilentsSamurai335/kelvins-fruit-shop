<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        @media print {
            .no-print { display: none !important; }
            body, #wrapper, .main-content, .container-fluid {
                margin: 0 !important; padding: 0 !important; width: 100% !important; background: white !important; color: black !important;
            }
            .card { border: none !important; box-shadow: none !important; }
            .table { width: 100% !important; border: 1px solid black !important; }
            .table td, .table th { border: 1px solid black !important; }
        }

        @media screen {
            .print-only { display: none !important; }
        }

        @media print {
            .no-print, .sidebar { display: none !important; }

            /* Forces the main content to take up the full page width when the sidebar hides */
            .main-content { width: 100% !important; margin: 0 !important; }

            /* Optional: Removes background colors to save printer ink */
            body { background-color: white !important; color: black !important; }
        }
    </style>
</head>
<body>
<div class="print-only text-center mb-4">
    <img src="/images/logo-icon.png" alt="Fruity Fusion Logo" style="height: 80px;">    <h2 class="mt-2">Fruity Fusion - Official Report</h2>
</div>

<div class="d-flex" id="wrapper">

    <div class="no-print" style="display: contents;">
        <div th:replace="~{fragments :: sidebar(activePage='sales')}"></div>
    </div>

    <div class="main-content w-100">
        <div class="container-fluid p-4">

            <div class="no-print">
                <div th:replace="~{fragments :: topbar}"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 no-print">
                <h2 class="fw-bold">💰 Sales History</h2>
                <div class="btn-group">
                    <button onclick="window.print()" class="btn btn-outline-dark">
                        <i class="fas fa-file-pdf"></i> PDF / Print
                    </button>
                    <button onclick="exportToWord('salesTable')" class="btn btn-primary">
                        <i class="fas fa-file-word"></i> Word
                    </button>
                    <button onclick="exportTableToExcel('salesTable', 'sales_report')" class="btn btn-success">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                </div>
            </div>

            <div class="card mb-4 border-0 shadow-sm no-print">
                <div class="card-body py-3 d-flex align-items-center flex-wrap gap-3">

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Quick View</label>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'today')">Today</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'week')">Week</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'month')">Month</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'all')">All</button>
                        </div>
                    </div>

                    <div class="vr mx-1"></div>

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Specific Date</label>
                        <div class="d-flex gap-1">
                            <input type="date" id="specificDate" class="form-control form-control-sm">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="updateFilters('date', null)">Go</button>
                        </div>
                    </div>

                    <div class="vr mx-1"></div>

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Payment Type</label>
                        <div class="d-flex gap-1">
                            <select id="paymentMethod" class="form-select form-select-sm">
                                <option value="ALL">All Types</option>
                                <option value="CASH">Cash</option>
                                <option value="MPESA">M-Pesa</option>
                            </select>
                            <button type="button" class="btn btn-warning btn-sm fw-bold text-dark" onclick="updateFilters('payment', null)">Filter</button>
                        </div>
                    </div>

                    <div class="vr mx-1"></div>

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Monthly Archive</label>
                        <div class="d-flex gap-1">
                            <select id="archiveMonth" class="form-select form-select-sm" style="width: auto; min-width: 100px;">
                                <option value="1">January</option>
                                <option value="2">February</option>
                                <option value="3">March</option>
                                <option value="4">April</option>
                                <option value="5">May</option>
                                <option value="6">June</option>
                                <option value="7">July</option>
                                <option value="8">August</option>
                                <option value="9">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                            <input type="number" id="archiveYear" class="form-control form-control-sm" style="width: 70px;" value="2026">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="updateFilters('month', null)">Go</button>
                        </div>
                    </div>

                    <form th:action="@{/sales}" method="get">
                        <!-- The invisible label that pushes the bar down to align with the others -->
                        <label class="form-label d-block mb-1">&nbsp;</label>

                        <div class="d-flex">
                            <input type="hidden" name="period" th:value="${param.period}">
                            <input type="hidden" name="category" th:value="${param.category}">

                            <input type="text" name="search" class="form-control bg-dark text-light border-secondary me-2" placeholder="Search sales...">
                            <button type="submit" class="btn btn-warning">Search</button>
                        </div>
                    </form>

                </div>
            </div>

            <div class="card mb-4 border-0 shadow-sm bg-success text-white">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-0 opacity-75" th:text="${periodTitle}">Today's Sales</h6>
                        <small>Total Gross Revenue</small>
                    </div>
                    <h2 class="fw-bold mb-0" th:text="'KES ' + ${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 2, 'POINT')}">0.00</h2>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="accordion" id="salesAccordion">
                        <div class="accordion-item bg-dark border-secondary mb-2" th:each="entry, stat : ${groupedSales}">

                            <h2 class="accordion-header" th:id="'heading' + ${stat.index}">
                                <button class="accordion-button bg-dark text-light border-secondary d-flex justify-content-between"
                                        th:classappend="${stat.index != 0} ? 'collapsed' : ''"
                                        type="button" data-bs-toggle="collapse" th:data-bs-target="'#collapse' + ${stat.index}">
                                        <!-- Wrap the text and badge in a full-width flex container -->
                                        <div class="d-flex justify-content-between align-items-center w-100 me-3">
                                            <span th:text="${entry.key}" class="fw-bold m-0">SEPTEMBER 2026</span>
                                            <span class="badge bg-success fs-6">
                                                KES <span th:text="${#aggregates.sum(entry.value.![totalAmount])}">0.0</span>
                                            </span>
                                        </div>
                                </button>
                            </h2>

                            <div th:id="'collapse' + ${stat.index}"
                                 class="accordion-collapse collapse"
                                 th:classappend="${stat.index == 0} ? 'show' : ''"
                                 data-bs-parent="#salesAccordion">
                                <div class="accordion-body p-0">
                                    <table class="table table-dark table-hover mb-0 border-secondary">
                                        <thead class="table-dark">
                                        <tr>
                                            <th>Time</th>
                                            <th>Item</th>
                                            <th>Qty</th>
                                            <th>Seller</th>
                                            <th>Method</th>
                                            <th class="text-success">Amount</th>
                                            <th sec:authorize="hasRole('ADMIN')">Action</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="sale : ${entry.value}">
                                            <!-- Formats date as DD-MM HH:MM -->
                                            <td th:text="${#temporals.format(sale.saleDateTime, 'dd-MM HH:mm')}"></td>
                                            <td th:text="${sale.itemsSold}"></td>
                                            <td th:text="${sale.quantity}">1</td>
                                            <td th:text="${#strings.isEmpty(sale.seller) ? 'Kelvin' : sale.seller}"></td>                                            <td>
                                                <span class="badge"
                                                      th:classappend="${#strings.toUpperCase(sale.paymentMethod) == 'MPESA'} ? 'bg-success' : 'bg-secondary'"
                                                      th:text="${sale.paymentMethod}">
                                                </span>
                                            </td>
                                            <td class="text-success fw-bold" th:text="${sale.totalAmount}"></td>
                                            <td sec:authorize="hasRole('ADMIN')">
                                                <div class="d-flex gap-2">
                                                    <a th:href="@{/sales/edit/{id}(id=${sale.id})}" class="btn btn-sm btn-outline-primary">
                                                        <i class="fas fa-edit"></i>
                                                    </a>
                                                    <a th:href="@{/sales/delete/{id}(id=${sale.id})}" class="btn btn-sm btn-outline-danger">
                                                        <i class="fas fa-trash"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
        </div>
    </div>
</div>

<script>
    // --- EXPORT FUNCTIONS (Unchanged) ---
    function exportTableToExcel(tableID, filename = '') {
        var downloadLink;
        var dataType = 'application/vnd.ms-excel';
        var tableSelect = document.getElementById(tableID);
        var tableHTML = tableSelect.outerHTML.replace(/ /g, '%20');
        filename = filename ? filename + '.xls' : 'sales_data.xls';
        downloadLink = document.createElement("a");
        document.body.appendChild(downloadLink);
        if (navigator.msSaveOrOpenBlob) {
            var blob = new Blob(['\ufeff', tableHTML], { type: dataType });
            navigator.msSaveOrOpenBlob(blob, filename);
        } else {
            downloadLink.href = 'data:' + dataType + ', ' + tableHTML;
            downloadLink.download = filename;
            downloadLink.click();
        }
    }

    function exportToWord(tableID) {
        var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML to Word</title></head><body>";
        var footer = "</body></html>";
        var sourceHTML = header + document.getElementById(tableID).innerHTML + footer;
        var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
        var fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        fileDownload.href = source;
        fileDownload.download = 'sales_report.doc';
        fileDownload.click();
        document.body.removeChild(fileDownload);
    }

    // --- MASTER FILTER ENGINE ---

    // 1. Maintain state when the page reloads
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);

        if (params.has('paymentMethod')) {
            document.getElementById('paymentMethod').value = params.get('paymentMethod');
        }
        if (params.has('date')) {
            document.getElementById('specificDate').value = params.get('date');
        }
        if (params.has('month')) {
            document.getElementById('archiveMonth').value = params.get('month');
            document.getElementById('archiveYear').value = params.get('year') || new Date().getFullYear();
        }
    });

    // 2. Build and execute the URL
    function updateFilters(filterType, value) {
        const params = new URLSearchParams(window.location.search);

        // Always apply the currently selected payment method
        const payment = document.getElementById('paymentMethod').value;
        params.set('paymentMethod', payment);

        if (filterType === 'period') {
            params.delete('date');
            params.delete('month');
            params.delete('year');

            if (value === 'all') {
                params.delete('period');
            } else {
                params.set('period', value);
            }
        }
        else if (filterType === 'date') {
            params.delete('period');
            params.delete('month');
            params.delete('year');
            const dateVal = document.getElementById('specificDate').value;
            if (dateVal) params.set('date', dateVal);
        }
        else if (filterType === 'month') {
            params.delete('period');
            params.delete('date');
            const monthVal = document.getElementById('archiveMonth').value;
            const yearVal = document.getElementById('archiveYear').value;
            params.set('month', monthVal);
            params.set('year', yearVal);
        }

        window.location.href = '/sales?' + params.toString();
    }
</script>

<!-- Only displays if the controller passed 'editSale' to the model -->
<div th:if="${editSale != null}" class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.7);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Edit Transaction</h5>
                <a th:href="@{/sales}" class="btn-close btn-close-white"></a>
            </div>
            <div class="modal-body">
                <!-- Build your edit inputs here using th:object="${editSale}" -->
                <form th:action="@{/sales/save}" method="post" th:object="${editSale}">
                    <input type="hidden" th:field="*{id}" />

                    <label class="form-label text-muted small fw-bold">Quantity</label>
                    <input type="number" class="form-control form-control-sm mb-2" th:field="*{quantity}" />

                    <label class="form-label text-muted small fw-bold mt-2">Payment Method</label>
                    <select class="form-select form-select-sm mb-2" th:field="*{paymentMethod}">
                        <option value="Cash">CASH</option>
                        <option value="Mpesa">MPESA</option>
                    </select>

                    <label class="form-label text-muted small fw-bold mt-2">Amount</label>
                    <input type="number" step="0.5" class="form-control form-control-sm mb-3" th:field="*{totalAmount}" />

                    <button type="submit" class="btn btn-primary w-100">Update Sale</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
