<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales History - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='sales')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>
            <h2 class="fw-bold mb-4">💰 Sales History</h2>

            <div class="card mb-3 border-0 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">

                    <div class="btn-group">
                        <a href="/sales?period=today" class="btn btn-outline-primary">📅 Today</a>
                        <a href="/sales?period=month" class="btn btn-outline-primary">🗓️ Current Month</a>
                        <a href="/sales?period=all" class="btn btn-outline-secondary">♾️ All Time</a>
                    </div>

                    <form action="/sales" method="get" class="d-flex align-items-center gap-2">
                        <select name="month" class="form-select" style="width: auto;">
                            <option value="1" th:selected="${selectedMonth == 1}">January</option>
                            <option value="2" th:selected="${selectedMonth == 2}">February</option>
                            <option value="3" th:selected="${selectedMonth == 3}">March</option>
                            <option value="4" th:selected="${selectedMonth == 4}">April</option>
                            <option value="5" th:selected="${selectedMonth == 5}">May</option>
                            <option value="6" th:selected="${selectedMonth == 6}">June</option>
                            <option value="7" th:selected="${selectedMonth == 7}">July</option>
                            <option value="8" th:selected="${selectedMonth == 8}">August</option>
                            <option value="9" th:selected="${selectedMonth == 9}">September</option>
                            <option value="10" th:selected="${selectedMonth == 10}">October</option>
                            <option value="11" th:selected="${selectedMonth == 11}">November</option>
                            <option value="12" th:selected="${selectedMonth == 12}">December</option>
                        </select>
                        <input type="number" name="year" class="form-control" style="width: 80px;" th:value="${selectedYear}">
                        <button type="submit" class="btn btn-dark">Go</button>
                    </form>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm" style="background-color: var(--ff-yellow);">
                        <div class="card-body text-center text-dark p-4">
                            <h5 class="card-title" th:text="${periodTitle} + ' Revenue'">Total Revenue</h5>
                            <p class="card-text display-5 fw-bold">
                                KES <span th:text="${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Receipt ID</th>
                            <th>Item Sold</th>
                            <th>Amount (KES)</th>
                            <th>Time</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sale : ${listSales}">
                            <td th:text="${sale.id}" class="text-muted">1</td>
                            <td th:text="${sale.itemsSold}" class="fw-bold">Mango</td>
                            <td th:text="${#numbers.formatDecimal(sale.totalAmount, 1, 'COMMA', 2, 'POINT')}">200.00</td>
                            <td th:text="${#temporals.format(sale.saleDateTime, 'dd-MM-yyyy HH:mm')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
