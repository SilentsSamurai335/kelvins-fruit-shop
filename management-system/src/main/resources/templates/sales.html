<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales History - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        @media print {
            /* Hide Sidebar, Buttons, Filters */
            .no-print { display: none !important; }

            /* Reset Layout for Paper */
            body, #wrapper, .main-content, .container-fluid {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                background: white !important;
                color: black !important;
            }

            /* Clean Card Look */
            .card { border: none !important; box-shadow: none !important; }

            /* Force Table Borders */
            .table { width: 100% !important; border: 1px solid black !important; }
            .table td, .table th { border: 1px solid black !important; }
        }
    </style>
</head>
<body>

<div class="d-flex" id="wrapper">

    <div class="no-print" style="display: contents;">
        <div th:replace="~{fragments :: sidebar(activePage='sales')}"></div>
    </div>

    <div class="main-content">
        <div class="container-fluid">

            <div class="no-print">
                <div th:replace="~{fragments :: topbar}"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 no-print">
                <h2 class="fw-bold">💰 Sales History</h2>
                <div class="btn-group">
                    <button onclick="window.print()" class="btn btn-outline-dark">
                        <i class="fas fa-file-pdf"></i> PDF / Print
                    </button>
                    <button onclick="exportToWord('salesTable')" class="btn btn-primary">
                        <i class="fas fa-file-word"></i> Word
                    </button>
                    <button onclick="exportTableToExcel('salesTable', 'sales_report')" class="btn btn-success">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                </div>
            </div>

            <div class="card mb-4 border-0 shadow-sm no-print">
                <div class="card-body py-3">
                    <form action="/sales" method="get" class="row g-3 align-items-center">

                        <div class="col-auto">
                            <label class="small text-muted fw-bold d-block">Quick View</label>
                            <div class="btn-group">
                                <a href="/sales?period=today" class="btn btn-sm btn-outline-secondary">Today</a>
                                <a href="/sales?period=week" class="btn btn-sm btn-outline-secondary">Week</a>
                                <a href="/sales?period=month" class="btn btn-sm btn-outline-secondary">Month</a>
                                <a href="/sales?period=all" class="btn btn-sm btn-outline-dark">All</a>
                            </div>
                        </div>

                        <div class="col-auto border-start ps-3">
                            <label class="small text-muted fw-bold d-block">Specific Date</label>
                            <div class="input-group input-group-sm">
                                <input type="date" name="date" class="form-control" th:value="${selectedDate}">
                                <button type="submit" class="btn btn-dark">Go</button>
                            </div>
                        </div>

                        <div class="col-auto">
                            <label class="small fw-bold text-muted d-block">Payment Type</label>
                            <div class="d-flex gap-1">
                                <select name="paymentMethod" class="form-select form-select-sm" style="width: 130px;">
                                    <option value="ALL" th:selected="${selectedPayment == 'ALL'}">All Types</option>
                                    <option value="CASH" th:selected="${selectedPayment == 'CASH'}">Cash Only</option>
                                    <option value="MPESA" th:selected="${selectedPayment == 'MPESA'}">M-Pesa Only</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-dark">Filter</button>
                            </div>
                        </div>

                        <div class="col-auto border-start ps-3">
                            <label class="small text-muted fw-bold d-block">Monthly Archive</label>
                            <div class="input-group input-group-sm">
                                <select name="month" class="form-select" style="width: auto; min-width: 100px;">
                                    <option value="1" th:selected="${selectedMonth == 1}">January</option>
                                    <option value="2" th:selected="${selectedMonth == 2}">February</option>
                                    <option value="3" th:selected="${selectedMonth == 3}">March</option>
                                    <option value="4" th:selected="${selectedMonth == 4}">April</option>
                                    <option value="5" th:selected="${selectedMonth == 5}">May</option>
                                    <option value="6" th:selected="${selectedMonth == 6}">June</option>
                                    <option value="7" th:selected="${selectedMonth == 7}">July</option>
                                    <option value="8" th:selected="${selectedMonth == 8}">August</option>
                                    <option value="9" th:selected="${selectedMonth == 9}">September</option>
                                    <option value="10" th:selected="${selectedMonth == 10}">October</option>
                                    <option value="11" th:selected="${selectedMonth == 11}">November</option>
                                    <option value="12" th:selected="${selectedMonth == 12}">December</option>
                                </select>
                                <input type="number" name="year" class="form-control" style="width: 70px;" th:value="${selectedYear}">
                                <button type="submit" class="btn btn-outline-dark">Go</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mb-4 border-0 shadow-sm bg-success text-white">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-0 opacity-75" th:text="${periodTitle}">Today's Sales</h6>
                        <small>Total Gross Revenue</small>
                    </div>
                    <h2 class="fw-bold mb-0" th:text="'KES ' + ${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 2, 'POINT')}">0.00</h2>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle" id="salesTable">
                        <thead class="table-light">
                        <tr>
                            <th class="text-start">Time</th>
                            <th class="text-start">Item</th>
                            <th class="text-center">Qty</th>
                            <th class="text-center">Method</th>
                            <th class="text-end">Amount</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sale : ${listSales}">
                            <td class="text-start" th:text="${#temporals.format(sale.saleDateTime, 'dd-MM HH:mm')}"></td>
                            <td class="text-start">
                                <span th:text="${sale.itemsSold}" class="fw-bold"></span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-light text-dark border" th:text="${sale.quantity}">1</span>
                            </td>
                            <td class="text-center">
                                        <span th:text="${sale.paymentMethod}"
                                              th:class="${sale.paymentMethod == 'Mpesa'} ? 'badge bg-success' : 'badge bg-secondary'">
                                        </span>
                            </td>
                            <td class="text-end fw-bold text-success"
                                th:text="${#numbers.formatDecimal(sale.totalAmount, 1, 'COMMA', 2, 'POINT')}">
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function exportTableToExcel(tableID, filename = '') {
        var downloadLink;
        var dataType = 'application/vnd.ms-excel';
        var tableSelect = document.getElementById(tableID);
        var tableHTML = tableSelect.outerHTML.replace(/ /g, '%20');
        filename = filename ? filename + '.xls' : 'sales_data.xls';
        downloadLink = document.createElement("a");
        document.body.appendChild(downloadLink);
        if (navigator.msSaveOrOpenBlob) {
            var blob = new Blob(['\ufeff', tableHTML], { type: dataType });
            navigator.msSaveOrOpenBlob(blob, filename);
        } else {
            downloadLink.href = 'data:' + dataType + ', ' + tableHTML;
            downloadLink.download = filename;
            downloadLink.click();
        }
    }

    function exportToWord(tableID) {
        var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML to Word</title></head><body>";
        var footer = "</body></html>";
        var sourceHTML = header + document.getElementById(tableID).innerHTML + footer;
        var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
        var fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        fileDownload.href = source;
        fileDownload.download = 'sales_report.doc';
        fileDownload.click();
        document.body.removeChild(fileDownload);
    }
</script>
</body>
</html>
