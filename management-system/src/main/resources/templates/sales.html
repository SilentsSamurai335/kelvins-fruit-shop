<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History - Fruity Fusion</title>
    <script>
        // Check local storage for common dark mode keys used by Bootstrap toggles
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('data-bs-theme') || localStorage.getItem('bsTheme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        @media print {
            .no-print { display: none !important; }
            body, #wrapper, .main-content, .container-fluid {
                margin: 0 !important; padding: 0 !important; width: 100% !important; background: white !important; color: black !important;
            }
            .card { border: none !important; box-shadow: none !important; }
            .table { width: 100% !important; border: 1px solid black !important; }
            .table td, .table th { border: 1px solid black !important; }
        }

        @media screen {
            .print-only { display: none !important; }
        }

        @media print {
            .no-print, .sidebar { display: none !important; }

            /* Forces the main content to take up the full page width when the sidebar hides */
            .main-content { width: 100% !important; margin: 0 !important; }

            /* Optional: Removes background colors to save printer ink */
            body { background-color: white !important; color: black !important; }
        }
    </style>
</head>
<body>
<div class="print-only text-center mb-4">
    <img src="/images/logo-icon.png" alt="Fruity Fusion Logo" style="height: 80px;">    <h2 class="mt-2">Fruity Fusion - Official Report</h2>
</div>

<div class="d-flex" id="wrapper">

    <div class="no-print" style="display: contents;">
        <div th:replace="~{fragments :: sidebar(activePage='sales')}"></div>
    </div>

    <div class="main-content w-100">
        <div class="container-fluid p-4">

            <div class="no-print">
                <div th:replace="~{fragments :: topbar}"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 no-print">
                <h2 class="fw-bold">💰 Sales History</h2>
                <div class="btn-group">
                    <button onclick="window.print()" class="btn btn-outline-dark">
                        <i class="fas fa-file-pdf"></i> PDF / Print
                    </button>
                    <button onclick="exportToWord('salesTable')" class="btn btn-primary">
                        <i class="fas fa-file-word"></i> Word
                    </button>
                    <button onclick="exportTableToExcel('salesTable', 'sales_report')" class="btn btn-success">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                </div>
            </div>

            <div class="card mb-4 border-0 shadow-sm no-print">
                <div class="card-body py-3 d-flex align-items-center flex-wrap gap-3">

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Quick View</label>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'today')">Today</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'week')">Week</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'month')">Month</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="updateFilters('period', 'all')">All</button>
                        </div>
                    </div>

                    <div class="vr mx-1"></div>

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Specific Date</label>
                        <div class="d-flex gap-1">
                            <input type="date" id="specificDate" class="form-control form-control-sm">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="updateFilters('date', null)">Go</button>
                        </div>
                    </div>

                    <div class="vr mx-1"></div>

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Payment Type</label>
                        <div class="d-flex gap-1">
                            <select id="paymentMethod" class="form-select form-select-sm">
                                <option value="ALL">All Types</option>
                                <option value="CASH">Cash</option>
                                <option value="MPESA">M-Pesa</option>
                                <option value="SPLIT">Split</option>
                                <option value="DEBT">Debt</option>
                            </select>
                            <button type="button" class="btn btn-warning btn-sm fw-bold text-dark" onclick="updateFilters('payment', null)">Filter</button>
                        </div>
                    </div>

                    <div class="vr mx-1"></div>

                    <div>
                        <label class="small text-muted fw-bold mb-1 d-block">Monthly Archive</label>
                        <div class="d-flex gap-1">
                            <select id="archiveMonth" class="form-select form-select-sm" style="width: auto; min-width: 100px;">
                                <option value="1">January</option>
                                <option value="2">February</option>
                                <option value="3">March</option>
                                <option value="4">April</option>
                                <option value="5">May</option>
                                <option value="6">June</option>
                                <option value="7">July</option>
                                <option value="8">August</option>
                                <option value="9">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                            <input type="number" id="archiveYear" class="form-control form-control-sm" style="width: 70px;" value="2026">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="updateFilters('month', null)">Go</button>
                        </div>
                    </div>

                    <form th:action="@{/sales}" method="get">
                        <!-- The invisible label that pushes the bar down to align with the others -->
                        <label class="form-label d-block mb-1">&nbsp;</label>

                        <div class="d-flex">
                            <input type="hidden" name="period" th:value="${param.period}">
                            <input type="hidden" name="category" th:value="${param.category}">

                            <input type="text" name="search" class="form-control bg-dark text-light border-secondary me-2" placeholder="Search sales...">
                            <button type="submit" class="btn btn-warning">Search</button>

                            <div class="ms-auto d-flex gap-2">
                                <a th:href="@{/sales}" class="btn btn-outline-danger ms-3">Clear</a>
                            </div>
                        </div>
                    </form>

                </div>
            </div>

            <div class="card mb-4 border-0 shadow-sm bg-success text-white">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-0 opacity-75" th:text="${periodTitle}">Today's Sales</h6>
                        <small>Total Gross Revenue</small>
                    </div>
                    <h2 class="fw-bold mb-0" th:text="'KES ' + ${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 2, 'POINT')}">0.00</h2>
                </div>
            </div>

            <!-- NEW: Dynamic Staff Performance Cards (Visible only to Admin/Kelvin) -->
            <div class="row g-3 mb-4" id="staffCardsContainer" sec:authorize="hasAnyRole('ADMIN', 'Kelvin')">
                <th:block th:each="staff : ${salesBySeller}">
                    <div class="col-md-3 col-sm-6 d-print-none">
                        <div class="card border-0 shadow-sm h-100 staff-card text-white" th:data-name="${staff.key}">
                            <div class="card-body p-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="text-uppercase fw-bold opacity-75 mb-0" th:text="${staff.key}"></h6>
                                    <i class="fas fa-user-circle fs-4 opacity-50"></i>
                                </div>
                                <h4 class="mb-0 fw-bold" th:text="${'KES ' + #numbers.formatDecimal(staff.value, 1, 'COMMA', 2, 'POINT')}"></h4>
                            </div>
                        </div>
                    </div>
                </th:block>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="accordion" id="salesAccordion">
                        <div class="accordion-item bg-dark border-secondary mb-2" th:each="entry, stat : ${groupedSales}">

                            <h2 class="accordion-header" th:id="'heading' + ${stat.index}">
                                <button class="accordion-button bg-dark text-light border-secondary d-flex justify-content-between"
                                        th:classappend="${stat.index != 0} ? 'collapsed' : ''"
                                        type="button" data-bs-toggle="collapse" th:data-bs-target="'#collapse' + ${stat.index}">
                                        <!-- Wrap the text and badge in a full-width flex container -->
                                        <div class="d-flex justify-content-between align-items-center w-100 me-3">
                                            <span th:text="${entry.key}" class="fw-bold m-0">SEPTEMBER 2026</span>
                                            <span class="badge bg-success fs-6">
                                                KES <span th:text="${#aggregates.sum(entry.value.![totalAmount])}">0.0</span>
                                            </span>
                                        </div>
                                </button>
                            </h2>

                            <div th:id="'collapse' + ${stat.index}"
                                 class="accordion-collapse collapse"
                                 th:classappend="${stat.index == 0} ? 'show' : ''"
                                 data-bs-parent="#salesAccordion">
                                <div class="accordion-body p-0">
                                    <table class="table table-dark table-hover mb-0 border-secondary">
                                        <thead class="table-dark">
                                        <tr>
                                            <th>Time</th>
                                            <th>Item</th>
                                            <th>Qty</th>
                                            <th>Seller</th>
                                            <th>Method</th>
                                            <th class="text-success">Amount</th>
                                            <th sec:authorize="hasRole('ADMIN')">Action</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="sale : ${entry.value}">
                                            <!-- Formats date as DD-MM HH:MM -->
                                            <td th:text="${#temporals.format(sale.saleDateTime, 'dd-MM HH:mm')}"></td>
                                            <td th:text="${sale.itemsSold}"></td>
                                            <td th:text="${sale.quantity}">1</td>
                                            <td th:text="${#strings.isEmpty(sale.seller) ? 'Kelvin' : sale.seller}"></td>                                            <td>
                                                <span class="badge text-uppercase"
                                                      th:classappend="${
                                                          #strings.toUpperCase(sale.paymentMethod) == 'MPESA' ? 'bg-success' :
                                                          (#strings.toUpperCase(sale.paymentMethod) == 'DEBT' ? 'bg-danger' :
                                                          (#strings.toUpperCase(sale.paymentMethod).contains('SPLIT') ? 'bg-info text-dark' : 'bg-secondary'))
                                                      }"
                                                      th:text="${sale.paymentMethod}">
                                                </span>
                                            </td>
                                            <td class="text-success fw-bold" th:text="${sale.totalAmount}"></td>
                                            <td sec:authorize="hasRole('ADMIN')">
                                                <div class="d-flex gap-2">
                                                    <a th:href="@{/sales/edit/{id}(id=${sale.id})}" class="btn btn-sm btn-outline-primary">
                                                        <i class="fas fa-edit"></i>
                                                    </a>
                                                    <a th:href="@{/sales/delete/{id}(id=${sale.id})}" class="btn btn-sm btn-outline-danger">
                                                        <i class="fas fa-trash"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
        </div>
    </div>
</div>

<script>
    // --- EXPORT FUNCTIONS (Unchanged) ---
    function exportTableToExcel(tableID, filename = '') {
        var downloadLink;
        var dataType = 'application/vnd.ms-excel';
        var tableSelect = document.getElementById(tableID);
        var tableHTML = tableSelect.outerHTML.replace(/ /g, '%20');
        filename = filename ? filename + '.xls' : 'sales_data.xls';
        downloadLink = document.createElement("a");
        document.body.appendChild(downloadLink);
        if (navigator.msSaveOrOpenBlob) {
            var blob = new Blob(['\ufeff', tableHTML], { type: dataType });
            navigator.msSaveOrOpenBlob(blob, filename);
        } else {
            downloadLink.href = 'data:' + dataType + ', ' + tableHTML;
            downloadLink.download = filename;
            downloadLink.click();
        }
    }

    function exportToWord(tableID) {
        var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML to Word</title></head><body>";
        var footer = "</body></html>";
        var sourceHTML = header + document.getElementById(tableID).innerHTML + footer;
        var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
        var fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        fileDownload.href = source;
        fileDownload.download = 'sales_report.doc';
        fileDownload.click();
        document.body.removeChild(fileDownload);
    }

    // --- MASTER FILTER ENGINE ---

    // 1. Maintain state when the page reloads
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);

        if (params.has('paymentMethod')) {
            document.getElementById('paymentMethod').value = params.get('paymentMethod');
        }
        if (params.has('date')) {
            document.getElementById('specificDate').value = params.get('date');
        }
        if (params.has('month')) {
            document.getElementById('archiveMonth').value = params.get('month');
            document.getElementById('archiveYear').value = params.get('year') || new Date().getFullYear();
        }
    });

    // 2. Build and execute the URL
    function updateFilters(filterType, value) {
        const params = new URLSearchParams(window.location.search);

        // Always apply the currently selected payment method
        const payment = document.getElementById('paymentMethod').value;
        params.set('paymentMethod', payment);

        if (filterType === 'period') {
            params.delete('date');
            params.delete('month');
            params.delete('year');

            if (value === 'all') {
                params.delete('period');
            } else {
                params.set('period', value);
            }
        }
        else if (filterType === 'date') {
            params.delete('period');
            params.delete('month');
            params.delete('year');
            const dateVal = document.getElementById('specificDate').value;
            if (dateVal) params.set('date', dateVal);
        }
        else if (filterType === 'month') {
            params.delete('period');
            params.delete('date');
            const monthVal = document.getElementById('archiveMonth').value;
            const yearVal = document.getElementById('archiveYear').value;
            params.set('month', monthVal);
            params.set('year', yearVal);
        }

        window.location.href = '/sales?' + params.toString();
    }

    // --- DYNAMIC STAFF CARD COLORS ---
    document.addEventListener("DOMContentLoaded", function() {
        const staffCards = document.querySelectorAll('.staff-card');

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            // HSL (Hue, Saturation, Lightness). Lightness set to 40% for good contrast with white text.
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 70%, 40%)`;
        }

        staffCards.forEach(card => {
            const name = card.getAttribute('data-name');
            if (name) {
                const uniqueColor = stringToColor(name.toUpperCase());
                // Color the entire background of the card
                card.style.backgroundColor = uniqueColor;
            }
        });
    });
</script>

<!-- Only displays if the controller passed 'editSale' to the model -->
<div th:if="${editSale != null}" class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.7);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Edit Transaction</h5>
                <a th:href="@{/sales}" class="btn-close btn-close-white"></a>
            </div>
            <div class="modal-body">
                <!-- Build your edit inputs here using th:object="${editSale}" -->
                <form th:action="@{/sales/save}" method="post" th:object="${editSale}" onsubmit="return handleEditSubmit()">
                    <input type="hidden" th:field="*{id}" />

                    <!-- Preserves seller and timestamp so editing doesn't wipe them -->
                    <input type="hidden" th:field="*{seller}" />
                    <input type="hidden" th:field="*{saleDateTime}" />

                    <label class="form-label text-muted small fw-bold">Item Sold</label>
                    <div class="input-group input-group-sm mb-2">
                        <select class="form-select" th:field="*{itemsSold}" id="editItemSelect">
                            <option th:value="*{itemsSold}" th:text="*{itemsSold}"></option>
                            <th:block th:each="p : ${listProducts}">
                                <option th:value="${p.name}" th:text="${p.name}"></option>
                            </th:block>
                        </select>
                        <button type="button" class="btn btn-warning fw-bold text-dark" onclick="openEditMixModal()">+ Mix</button>
                    </div>

                    <label class="form-label text-muted small fw-bold mt-2">Quantity</label>
                    <input type="number" class="form-control form-control-sm mb-2" th:field="*{quantity}" id="editQty" />

                    <label class="form-label text-muted small fw-bold mt-2">Payment Method</label>
                    <!-- Actual submitted value -->
                    <input type="hidden" name="paymentMethod" th:value="*{paymentMethod}" id="actualPaymentMethod" />
                    <!-- UI Selector -->
                    <select class="form-select form-select-sm mb-2" id="editPaymentMethodSelect" onchange="toggleEditSplit()">
                        <option value="CASH">CASH</option>
                        <option value="MPESA">MPESA</option>
                        <option value="SPLIT">SPLIT (M-Pesa & Cash)</option>
                        <option value="DEBT">DEBT</option>
                    </select>

                    <!-- Split Inputs (Hidden unless SPLIT is selected) -->
                    <div id="editSplitFields" class="row g-2 mb-2" style="display: none;">
                        <div class="col-6">
                            <label class="form-label text-muted small">M-Pesa (KES)</label>
                            <input type="number" step="0.5" id="editSplitMpesa" class="form-control form-control-sm" placeholder="M-Pesa">
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small">Cash (KES)</label>
                            <input type="number" step="0.5" id="editSplitCash" class="form-control form-control-sm" placeholder="Cash">
                        </div>
                    </div>

                    <label class="form-label text-muted small fw-bold mt-2">Amount</label>
                    <input type="number" step="0.5" class="form-control form-control-sm mb-3" th:field="*{totalAmount}" id="editTotalAmount" />

                    <button type="submit" class="btn btn-primary w-100 fw-bold">Update Sale</button>
                </form>
            </div>
        </div>
    </div>
</div>
    <!-- Hidden Thymeleaf Template for Beverages -->
    <div id="beverageTemplate" style="display: none;">
        <select class="form-select mixin-select">
            <option value="">Select Beverage...</option>
            <!-- Loops through products and ONLY includes Beverages -->
            <th:block th:each="p : ${listProducts}" th:if="${#strings.equalsIgnoreCase(p.category, 'Beverage')}">
                <option th:value="${p.name}" th:text="${p.name}"></option>
            </th:block>
        </select>
    </div>

    <!-- The Custom Mix Modal -->
    <div class="modal fade" id="mixModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-warning">🍹 Create Custom Mix</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- NEW: Base Flavor Selector -->
                    <div class="mb-3">
                        <label class="form-label fw-bold mb-1 small text-uppercase">Base Flavor:</label>
                        <select id="mixBaseFlavor" class="form-select form-select-sm bg-dark text-white border-secondary">
                            <option value="">Select Base Flavor...</option>
                            <th:block th:each="p : ${listProducts}" th:if="${#strings.equalsIgnoreCase(p.category, 'Beverage')}">
                                <option th:value="${p.name}" th:text="${p.name}"></option>
                            </th:block>
                        </select>
                    </div>

                    <!-- Add Mixins -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label fw-bold mb-0 small text-uppercase">Mix With:</label>
                            <button type="button" class="btn btn-sm btn-outline-warning fw-bold" onclick="addMixinRow()">+ Add Flavor</button>
                        </div>
                        <div id="mixinsContainer"></div>
                    </div>

                    <!-- Size & Quantity -->
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label fw-bold small text-muted">Size</label>
                            <select id="mixSize" class="form-select form-select-sm" onchange="updateMixPrice()">
                                <option value="250">250ml</option>
                                <option value="500">500ml</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold small text-muted">Quantity</label>
                            <input type="number" id="mixQty" class="form-control form-control-sm" value="1" min="1" onchange="updateMixPrice()">
                        </div>
                    </div>

                    <!-- Estimated Total -->
                    <div class="mt-4 p-3 rounded bg-black text-center border border-secondary">
                        <small class="text-muted d-block small">ESTIMATED TOTAL</small>
                        <h3 class="fw-bold text-success mb-0" id="mixTotalPrice">KES 60</h3>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-success fw-bold w-100" onclick="submitMix()">Confirm Mix</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. PRE-FILL EDIT MODAL ON LOAD ---
        document.addEventListener("DOMContentLoaded", function () {
            const rawMethodInput = document.getElementById("actualPaymentMethod");
            if (!rawMethodInput) return;

            const rawMethod = rawMethodInput.value || "";
            const methodSelect = document.getElementById("editPaymentMethodSelect");
            const upper = rawMethod.toUpperCase();

            if (upper.startsWith("SPLIT")) {
                methodSelect.value = "SPLIT";
                document.getElementById("editSplitFields").style.display = "flex";

                // Extract numbers from "Split (M-Pesa: 40.0, Cash: 20.0)"
                const mpesaMatch = rawMethod.match(/M-Pesa:\s*([0-9.]+)/i);
                const cashMatch = rawMethod.match(/Cash:\s*([0-9.]+)/i);

                if (mpesaMatch) document.getElementById("editSplitMpesa").value = mpesaMatch[1];
                if (cashMatch) document.getElementById("editSplitCash").value = cashMatch[1];
            } else if (upper.includes("MPESA")) {
                methodSelect.value = "MPESA";
            } else if (upper.includes("DEBT")) {
                methodSelect.value = "DEBT";
            } else {
                methodSelect.value = "CASH";
            }
        });

        // --- 2. TOGGLE SPLIT INPUTS ---
        function toggleEditSplit() {
            const select = document.getElementById("editPaymentMethodSelect");
            const splitDiv = document.getElementById("editSplitFields");
            if (select && splitDiv) {
                splitDiv.style.display = (select.value === "SPLIT") ? "flex" : "none";
            }
        }

        // --- 3. INTERCEPT & FORMAT EDIT SUBMISSION ---
        function handleEditSubmit() {
            const selected = document.getElementById("editPaymentMethodSelect").value;
            const actualInput = document.getElementById("actualPaymentMethod");

            if (selected === "SPLIT") {
                const mpesa = parseFloat(document.getElementById("editSplitMpesa").value) || 0;
                const cash = parseFloat(document.getElementById("editSplitCash").value) || 0;

                // FIX: Look for the exact explicit ID in your HTML
                const totalInput = document.getElementById("editTotalAmount");
                const total = totalInput ? parseFloat(totalInput.value) : 0;

                if (mpesa + cash !== total) {
                    alert(`Split amounts (KES ${mpesa + cash}) must equal the total amount (KES ${total}).`);
                    return false; // Stops form submission
                }

                // Inject the formatted string into the hidden input
                actualInput.value = `Split (M-Pesa: ${mpesa}, Cash: ${cash})`;
            } else {
                actualInput.value = selected;
            }

            return true; // Allows form submission
        }

        // --- 4. MIX MODAL LOGIC ---
        function openEditMixModal() {
            document.getElementById('mixinsContainer').innerHTML = '';
            document.getElementById('mixQty').value = 1;
            document.getElementById('mixSize').value = "250";
            addMixinRow();
            updateMixPrice();
            new bootstrap.Modal(document.getElementById('mixModal')).show();
        }

        function addMixinRow() {
            const container = document.getElementById('mixinsContainer');
            const templateHtml = document.getElementById('beverageTemplate').innerHTML;

            const rowDiv = document.createElement('div');
            rowDiv.className = 'd-flex gap-2 mb-2';
            rowDiv.innerHTML = templateHtml + '<button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">X</button>';

            container.appendChild(rowDiv);
        }

        function updateMixPrice() {
            const size = document.getElementById('mixSize').value;
            const qty = parseInt(document.getElementById('mixQty').value) || 1;
            const unitPrice = size === "500" ? 120 : 60;
            document.getElementById('mixTotalPrice').innerText = "KES " + (unitPrice * qty);
        }

        function submitMix() {
            const size = document.getElementById('mixSize').value;
            const qty = parseInt(document.getElementById('mixQty').value) || 1;
            const baseFlavor = document.getElementById('mixBaseFlavor').value;

            if (!baseFlavor) {
                alert("Please select a Base Flavor.");
                return;
            }

            const selects = document.querySelectorAll('.mixin-select');
            let mixins = [];
            selects.forEach(s => { if(s.value) mixins.push(s.value); });

            let finalName = baseFlavor + " (" + size + "ml)";
            if (mixins.length > 0) {
                finalName += " w/ " + mixins.join(" & ");
            }

            const unitPrice = size === "500" ? 120 : 60;
            const total = unitPrice * qty;

            // FIX: Look for your exact explicit IDs
            const editItemSelect = document.getElementById("editItemSelect");
            const option = document.createElement("option");
            option.value = finalName;
            option.text = finalName;
            editItemSelect.add(option);
            editItemSelect.value = finalName;

            document.getElementById("editQty").value = qty;
            document.getElementById("editTotalAmount").value = total;

            bootstrap.Modal.getInstance(document.getElementById('mixModal')).hide();
        }
    </script>
</body>
</html>
