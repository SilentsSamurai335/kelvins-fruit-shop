<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales History - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='sales')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>
            <h2 class="fw-bold mb-4">💰 Sales History</h2>

            <div class="d-flex justify-content-center mb-4 gap-2">
                <a href="/sales?period=today"
                   class="btn"
                   th:classappend="${activePeriod == 'today'} ? 'btn-primary' : 'btn-outline-primary'">
                    📅 Today
                </a>

                <a href="/sales?period=month"
                   class="btn"
                   th:classappend="${activePeriod == 'month'} ? 'btn-primary' : 'btn-outline-primary'">
                    🗓️ This Month
                </a>

                <a href="/sales?period=all"
                   class="btn"
                   th:classappend="${activePeriod == 'all'} ? 'btn-primary' : 'btn-outline-primary'">
                    ♾️ All Time
                </a>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm" style="background-color: var(--ff-yellow);">
                        <div class="card-body text-center text-dark p-4">
                            <h5 class="card-title" th:text="${periodTitle} + ' Revenue'">Total Revenue</h5>
                            <p class="card-text display-5 fw-bold">
                                KES <span th:text="${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Receipt ID</th>
                            <th>Item Sold</th>
                            <th>Amount (KES)</th>
                            <th>Time</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sale : ${listSales}">
                            <td th:text="${sale.id}" class="text-muted">1</td>
                            <td th:text="${sale.itemsSold}" class="fw-bold">Mango</td>
                            <td th:text="${#numbers.formatDecimal(sale.totalAmount, 1, 'COMMA', 2, 'POINT')}">200.00</td>
                            <td th:text="${#temporals.format(sale.saleDateTime, 'dd-MM-yyyy HH:mm')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
