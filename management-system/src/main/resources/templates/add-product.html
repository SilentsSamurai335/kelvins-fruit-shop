<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product - Fruity Fusion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2>Add New Product</h2>

<form th:action="@{/save-product}" th:object="${product}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="fw-bold">Juice Name:</label>
        <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Mango" required>
    </div>

    <div class="mb-3">
        <label class="fw-bold">Description:</label>
        <input type="text" th:field="*{description}" class="form-control" placeholder="Ingredients...">
    </div>

    <hr>

    <div class="row">
        <div class="col-md-6 border-end">
            <h5 class="text-success">🥤 250ML (Small)</h5>
            <div class="mb-3">
                <label>Price (KES):</label>
                <input type="number" step="0.01" th:field="*{priceSmall}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Current Stock:</label>
                <input type="number" th:field="*{stockSmall}" class="form-control" required>
            </div>
        </div>

        <div class="col-md-6">
            <h5 class="text-success">🥤 500ML (Large)</h5>
            <div class="mb-3">
                <label>Price (KES):</label>
                <input type="number" step="0.01" th:field="*{priceLarge}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Current Stock:</label>
                <input type="number" th:field="*{stockLarge}" class="form-control" required>
            </div>
        </div>
    </div>

    <hr>

    <button type="submit" class="btn btn-primary w-100 btn-lg">Save Product</button>
</form>

</body>
</html>
