<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product - Fruity Fusion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2>Add New Product</h2>

<form action="#" th:action="@{/save-product}" th:object="${product}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label>Product Name:</label>
        <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Mango Surprise" required>
    </div>

    <div class="mb-3">
        <label>Description:</label>
        <input type="text" th:field="*{description}" class="form-control" placeholder="Ingredients...">
    </div>

    <div class="mb-3">
        <label class="form-label">Cup Size / Portion:</label>
        <select th:field="*{size}" class="form-select">
            <option value="Regular">Regular (300ml)</option>
            <option value="Large">Large (500ml)</option>
            <option value="Jumbo">Jumbo (1 Litre)</option>
            <option value="Bottle">Takeaway Bottle</option>
        </select>
    </div>

    <div class="mb-3">
        <label>Price (KES):</label>
        <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Quantity in Stock:</label>
        <input type="number" th:field="*{quantity}" class="form-control" required min="0">
    </div>

    <button type="submit" class="btn btn-success">Save Product</button>
</form>

</body>
</html>
