<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='inventory')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <h2 class="fw-bold mb-4">✨ Add New Juice</h2>

            <div class="card shadow-sm border-0" style="max-width: 800px;">
                <div class="card-body p-4">

                    <form th:action="@{/save-product}" th:object="${product}" method="post">

                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Juice Name</label>
                            <input type="text" th:field="*{name}" class="form-control form-control-lg" placeholder="e.g. Mango Surprise" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <input type="text" th:field="*{description}" class="form-control" placeholder="Ingredients...">
                        </div>

                        <hr class="my-4">

                        <div class="row g-4">
                            <div class="col-md-6 border-end">
                                <h5 class="text-success fw-bold mb-3">🥤 250ML (Small)</h5>
                                <div class="mb-3">
                                    <label class="form-label">Price (KES)</label>
                                    <input type="number" step="0.01" th:field="*{priceSmall}" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Stock Count</label>
                                    <input type="number" th:field="*{stockSmall}" class="form-control" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <h5 class="text-success fw-bold mb-3">🥤 500ML (Large)</h5>
                                <div class="mb-3">
                                    <label class="form-label">Price (KES)</label>
                                    <input type="number" step="0.01" th:field="*{priceLarge}" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Stock Count</label>
                                    <input type="number" th:field="*{stockLarge}" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <a href="/products" class="btn btn-outline-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-lg px-5">Save Product</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
