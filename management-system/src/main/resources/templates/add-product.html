<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='inventory')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <h2 class="fw-bold mb-4">✨ Add New Juice</h2>

            <div class="card shadow-sm border-0" style="max-width: 800px;">
                <div class="card-body p-4">

                    <form th:action="@{/save-product}" th:object="${product}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="fw-bold">Category</label>
                            <select th:field="*{category}" id="prodCategory" class="form-select" onchange="toggleProductFields()" required>
                                <option value="Beverage">Beverages (Juice, Porridge, Coffee)</option>
                                <option value="Snack">Snack (Sold by Piece)</option>
                                <option value="Spice">Spice (Sold by Qty)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold">Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Mango or Samosa" required>
                        </div>

                        <div class="mb-3">
                            <label>Description</label>
                            <input type="text" th:field="*{description}" class="form-control">
                        </div>

                        <hr>

                        <div id="juiceFields">
                            <h5 class="text-success">🥤 Juice Pricing</h5>
                            <div class="row">
                                <div class="col-6">
                                    <label>250ml Price</label>
                                    <input type="number" step="0.01" th:field="*{priceSmall}" class="form-control" placeholder="0.00">
                                </div>
                                <div class="col-6">
                                    <label>500ml Price</label>
                                    <input type="number" step="0.01" th:field="*{priceLarge}" class="form-control" placeholder="0.00">
                                </div>
                            </div>
                            <input type="hidden" name="stockSmall" value="999">
                            <input type="hidden" name="stockLarge" value="999">
                        </div>

                        <div id="snackFields" style="display: none;">
                            <h5 class="text-warning">🍪 Inventory Details</h5>
                            <div class="row">
                                <div class="col-6">
                                    <label>Selling Price</label>
                                    <input type="number" step="0.01" id="singlePrice" name="priceSmall" class="form-control" placeholder="0.00">
                                </div>
                                <div class="col-6">
                                    <label>Current Stock</label>
                                    <input type="number" id="singleStock" name="stockSmall" class="form-control" placeholder="Qty">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4 btn-lg">Save Item</button>
                    </form>

                    <script>
                        function toggleProductFields() {
                            var cat = document.getElementById("prodCategory").value;
                            var juiceDiv = document.getElementById("juiceFields");
                            var snackDiv = document.getElementById("snackFields");

                            // Get all inputs inside the divs
                            var juiceInputs = juiceDiv.querySelectorAll("input");
                            var snackInputs = snackDiv.querySelectorAll("input");

                            if (cat === "Beverage") {
                                // SHOW BEVERAGE/JUICE
                                juiceDiv.style.display = "block";
                                snackDiv.style.display = "none";

                                // Enable Juice inputs, Disable Snack inputs
                                juiceInputs.forEach(i => i.disabled = false);
                                snackInputs.forEach(i => i.disabled = true);
                            }
                            else {
                                // SHOW SNACK/SPICE
                                juiceDiv.style.display = "none";
                                snackDiv.style.display = "block";

                                // Enable Snack inputs, Disable Juice inputs
                                snackInputs.forEach(i => i.disabled = false);
                                juiceInputs.forEach(i => i.disabled = true);
                            }
                        }

                        // Run once on load to set initial state
                        document.addEventListener("DOMContentLoaded", function() {
                            toggleProductFields();
                        });
                    </script>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
