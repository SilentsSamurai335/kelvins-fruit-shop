<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Income Statement - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments :: sidebar(activePage='income')}"></div>

    <div class="main-content">
        <div class="container-fluid">

            <div th:replace="~{fragments :: topbar}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">📑 Income Statement</h2>

                <form action="/income-statement" method="get" class="d-flex gap-2">
                    <select name="month" class="form-select">
                        <option value="1" th:selected="${selectedMonth == 1}">Jan</option>
                        <option value="2" th:selected="${selectedMonth == 2}">Feb</option>
                        <option value="3" th:selected="${selectedMonth == 3}">Mar</option>
                        <option value="4" th:selected="${selectedMonth == 4}">Apr</option>
                        <option value="5" th:selected="${selectedMonth == 5}">May</option>
                        <option value="6" th:selected="${selectedMonth == 6}">Jun</option>
                        <option value="7" th:selected="${selectedMonth == 7}">Jul</option>
                        <option value="8" th:selected="${selectedMonth == 8}">Aug</option>
                        <option value="9" th:selected="${selectedMonth == 9}">Sep</option>
                        <option value="10" th:selected="${selectedMonth == 10}">Oct</option>
                        <option value="11" th:selected="${selectedMonth == 11}">Nov</option>
                        <option value="12" th:selected="${selectedMonth == 12}">Dec</option>
                    </select>
                    <input type="number" name="year" class="form-control" style="width: 80px;" th:value="${selectedYear}">
                    <button type="submit" class="btn btn-primary">Go</button>
                </form>
            </div>

            <div class="card border-0 shadow-lg mx-auto" style="max-width: 800px;">
                <div class="card-header text-center py-4 border-bottom-0">
                    <img th:src="@{/images/logo-full.png}" alt="Logo" style="max-width: 150px; margin-bottom: 10px;">
                    <h4 class="fw-bold text-uppercase">Profit & Loss Statement</h4>
                    <p class="text-muted mb-0" th:text="'Period: ' + ${periodTitle}">Period: December 2025</p>
                </div>

                <div class="card-body p-5">

                    <h6 class="fw-bold text-success text-uppercase mb-3">Revenue Streams</h6>

                    <div class="d-flex justify-content-between mb-1">
                        <span>🥤 Beverages (Juice, Porridge)</span>
                        <span class="fw-bold" th:text="${#numbers.formatDecimal(revBeverages, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <span>🍪 Snacks</span>
                        <span class="fw-bold" th:text="${#numbers.formatDecimal(revSnacks, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <span>🌶️ Spices</span>
                        <span class="fw-bold" th:text="${#numbers.formatDecimal(revSpices, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-success">
                        <span class="fw-bold text-success">Total Gross Revenue</span>
                        <span class="fw-bold text-success" th:text="'+ ' + ${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 2, 'POINT')}"></span>
                    </div>

                    <h6 class="fw-bold text-danger text-uppercase mt-5 mb-3">Expense Breakdown</h6>

                    <div th:each="entry : ${expenseBreakdown}" class="d-flex justify-content-between mb-1 small">
                        <span th:text="${entry.key}">Rent</span> <span th:text="${#numbers.formatDecimal(entry.value, 1, 'COMMA', 2, 'POINT')}">5000.00</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-danger">
                        <span class="fw-bold text-danger">Total Expenses</span>
                        <span class="fw-bold text-danger" th:text="'- ' + ${#numbers.formatDecimal(totalExpenses, 1, 'COMMA', 2, 'POINT')}"></span>
                    </div>

                    <div class="mt-5 p-4 rounded border"
                         th:classappend="${netProfit >= 0} ? 'border-success bg-success-subtle' : 'border-danger bg-danger-subtle'">

                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h3 class="fw-bold mb-0" th:classappend="${netProfit >= 0} ? 'text-success' : 'text-danger'">NET INCOME</h3>
                                <small class="text-muted">Net Profit (Loss) for Period</small>
                            </div>
                            <h3 class="fw-bold mb-0"
                                th:classappend="${netProfit >= 0} ? 'text-success' : 'text-danger'"
                                th:text="${#numbers.formatDecimal(netProfit, 1, 'COMMA', 2, 'POINT')}">
                                0.00
                            </h3>
                        </div>
                    </div>

                </div>

                <div class="card-footer text-center py-3">
                    <button onclick="window.print()" class="btn btn-outline-dark btn-sm">
                        <i class="fas fa-print"></i> Print Report
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
