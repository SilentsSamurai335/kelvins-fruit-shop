<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Staff - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='users')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow border-0 mt-5">
                        <div class="card-header bg-warning fw-bold text-dark">
                            <i class="fas fa-user-edit"></i> Edit Staff Details
                        </div>
                        <div class="card-body">
                            <form th:action="@{/save-user}" th:object="${user}" method="post">
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Username</label>
                                    <input type="text" th:field="*{username}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Full Name</label>
                                    <input type="text" th:field="*{fullName}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Change Password</label>
                                    <input type="text" th:field="*{password}" class="form-control" placeholder="Enter new password to reset">
                                    <small class="text-muted">Leave blank to keep current password</small>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a href="/users" class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-success fw-bold">Update Staff</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
