<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Staff - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='users')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow border-0 mt-5">
                        <div class="card-header bg-warning fw-bold text-dark">
                            <i class="fas fa-user-edit"></i> Edit Staff Details
                        </div>
                        <div class="card-body">
                            <!-- The form must bind to the user object passed from your controller -->
                            <form th:action="@{/save-user}" th:object="${user}" method="post">

                                <!-- CRITICAL: Hidden ID field ensures it updates instead of creating a new user -->
                                <input type="hidden" th:field="*{id}" />

                                <div class="mb-3">
                                    <label class="form-label text-light fw-bold">Username</label>
                                    <input type="text" th:field="*{username}" class="form-control bg-dark text-light border-secondary" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-light fw-bold">Full Name</label>
                                    <input type="text" th:field="*{fullName}" class="form-control bg-dark text-light border-secondary" required>
                                </div>

                                <!-- NEW FIELD: National ID -->
                                <div class="mb-3">
                                    <label class="form-label text-light fw-bold">National ID</label>
                                    <input type="text" th:field="*{nationalId}" class="form-control bg-dark text-light border-secondary" required>
                                </div>

                                <!-- NEW FIELD: Phone Number -->
                                <div class="mb-3">
                                    <label class="form-label text-light fw-bold">Phone Number</label>
                                    <input type="text" th:field="*{phoneNumber}" class="form-control bg-dark text-light border-secondary" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-light fw-bold">Change Password</label>
                                    <!-- Notice we don't use required here so they can leave it blank -->
                                    <input type="text" th:field="*{password}" class="form-control bg-dark text-light border-secondary">
                                    <small class="text-light opacity-75">Leave blank to keep current password</small>
                                </div>

                                <!-- Buttons -->
                                <div class="d-flex justify-content-between mt-4">
                                    <!-- Make sure this href points to your actual staff list page URL -->
                                    <a th:href="@{/users}" class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-success">Update Staff</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
