<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Home - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='home')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="fw-bold">📊 Executive Dashboard</h2>
                    <p class="text-muted">Welcome back, <span sec:authentication="name" class="fw-bold text-dark">User</span>!</p>
                </div>
            </div>

            <div class="row" sec:authorize="hasRole('ADMIN')">
                <div class="col-md-8 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white">
                            <h5 class="fw-bold text-success mb-0">📈 Revenue Trend</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white">
                            <h5 class="fw-bold text-warning mb-0">🍕 Product Popularity</h5>
                        </div>
                        <div class="card-body">
                            <canvas id="productChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row" sec:authorize="!hasRole('ADMIN')">
                <div class="col-12 text-center mt-5">
                    <div class="alert alert-light shadow-sm p-5 border">
                        <h2>👋 Ready to Sell?</h2>
                        <p class="text-muted">Go to the Inventory page to start serving customers.</p>
                        <a href="/products" class="btn btn-primary btn-lg">Open POS System</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    var trendLabels = [[${trendDates}]];
    var trendData = [[${trendAmounts}]];
    const ctxTrend = document.getElementById('trendChart');
    if (ctxTrend) {
        new Chart(ctxTrend, {
            type: 'line',
            data: {
                labels: trendLabels,
                datasets: [{
                    label: 'Daily Sales (KES)',
                    data: trendData,
                    borderColor: '#198754',
                    backgroundColor: 'rgba(25, 135, 84, 0.1)',
                    borderWidth: 3,
                    pointBackgroundColor: '#FFC107',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });
    }

    var productLabels = [[${productLabels}]];
    var productData = [[${productData}]];
    const ctxProduct = document.getElementById('productChart');
    if (ctxProduct) {
        new Chart(ctxProduct, {
            type: 'doughnut',
            data: {
                labels: productLabels,
                datasets: [{
                    data: productData,
                    backgroundColor: ['#FFC107', '#DC3545', '#0D6EFD', '#198754', '#6610F2', '#FD7E14'],
                    borderWidth: 2
                }]
            },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }
</script>
</body>
</html>
