<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fruity Fusion</title>
    <script>
        // Check local storage for common dark mode keys used by Bootstrap toggles
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('data-bs-theme') || localStorage.getItem('bsTheme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='home')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="fw-bold">👋 Welcome Back, <span sec:authentication="name">User</span>!</h2>
                    <p class="text-muted">Here is what's happening at Fruity Fusion today.</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="row mb-4">
                    <div class="col-12 col-md-4">
                        <div class="card bg-dark text-light border-secondary shadow-sm">
                            <div class="card-body d-flex align-items-center">

                                <!-- Icon Section -->
                                <div class="me-3 text-success">
                                    <i class="fas fa-coins fa-3x"></i>
                                </div>

                                <!-- Data Section -->
                                <div>
                                    <h6 class="card-title text-muted mb-1 text-uppercase fw-bold">Today's Sales</h6>
                                    <h3 class="mb-0 fw-bold">
                                        <!-- Formats the number with commas and 2 decimal places -->
                                        KES <span th:text="${#numbers.formatDecimal(todaySalesTotal, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                                    </h3>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm border-0 h-100 bg-warning text-dark">
                        <div class="card-body text-center d-flex flex-column justify-content-center">
                            <i class="fas fa-cash-register fa-3x mb-3"></i>
                            <h5 class="fw-bold">Ready to Sell?</h5>
                            <a href="/products" class="btn btn-dark w-100 mt-2">Go to POS</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body text-center d-flex flex-column justify-content-center">
                            <i class="fas fa-chart-line fa-3x mb-3 text-primary"></i>
                            <h5 class="fw-bold">View Financials</h5>
                            <p class="small text-muted">Check reports & trends</p>
                            <a href="/analytics" class="btn btn-outline-primary w-100">Open Report</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body text-center d-flex flex-column justify-content-center">
                            <i class="fas fa-users fa-3x mb-3 text-success"></i>
                            <h5 class="fw-bold">Team Hub</h5>
                            <div th:if="${hasNewMessage}" class="badge bg-danger mb-2">New Messages!</div>
                            <div th:unless="${hasNewMessage}" class="text-muted small mb-2">All caught up</div>
                            <a href="/team" class="btn btn-outline-success w-100">Go to Chat</a>
                        </div>
                    </div>
                </div>

                <!-- Cash at Hand Card -->
                <div class="col-md-3">
                    <div class="card bg-dark text-light border-0 shadow-sm h-100" style="border-top: 4px solid #17a2b8 !important;">
                        <div class="card-body p-3 d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase fw-bold text-info opacity-75 mb-1">Cash at Hand</h6>
                                <h3 class="fw-bold mb-0 text-white" th:text="${'KES ' + #numbers.formatDecimal(cashAtHand, 1, 'COMMA', 2, 'POINT')}"></h3>
                            </div>
                            <!-- Edit Button (Visible to Kelvin/Admin ONLY) -->
                            <button class="btn btn-sm btn-outline-info border-0 fs-4"
                                    sec:authorize="hasAnyRole('ADMIN', 'Kelvin')"
                                    data-bs-toggle="modal" data-bs-target="#editCashModal">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Unpaid Debts Card -->
                <div class="col-md-3">
                    <div class="card bg-dark text-light border-0 shadow-sm h-100" style="border-top: 4px solid #dc3545 !important;">
                        <div class="card-body p-3 d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase fw-bold text-danger opacity-75 mb-1">Unpaid Debts</h6>
                                <h3 class="fw-bold mb-0 text-white" th:text="${'KES ' + #numbers.formatDecimal(totalOutstandingDebt, 1, 'COMMA', 2, 'POINT')}"></h3>
                            </div>
                            <i class="fas fa-hand-holding-usd fs-1 text-danger opacity-50"></i>
                        </div>
                    </div>
                </div>

                <!-- Edit Cash Modal -->
                <div class="modal fade" id="editCashModal" tabindex="-1">
                    <div class="modal-dialog modal-sm modal-dialog-centered">
                        <div class="modal-content bg-dark text-light border-secondary">
                            <form th:action="@{/update-cash}" method="post">
                                <div class="modal-header border-secondary">
                                    <h6 class="modal-title fw-bold text-info">Update Operating Cash</h6>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <label class="form-label text-muted small fw-bold">Actual Cash at Register</label>
                                    <input type="number" step="0.5" name="newCashAmount" class="form-control bg-dark text-light border-secondary" th:value="${cashAtHand}" required>
                                </div>
                                <div class="modal-footer border-secondary p-2">
                                    <button type="submit" class="btn btn-info w-100 fw-bold">Save Update</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
