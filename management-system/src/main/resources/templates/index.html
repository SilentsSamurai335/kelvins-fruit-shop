<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Dashboard - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='home')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="fw-bold">👋 Welcome Back, <span sec:authentication="name">User</span>!</h2>
                    <p class="text-muted">Here is what's happening at Fruity Fusion today.</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card shadow-sm border-0 h-100 bg-warning text-dark">
                        <div class="card-body text-center d-flex flex-column justify-content-center">
                            <i class="fas fa-cash-register fa-3x mb-3"></i>
                            <h5 class="fw-bold">Ready to Sell?</h5>
                            <a href="/products" class="btn btn-dark w-100 mt-2">Go to POS</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body text-center d-flex flex-column justify-content-center">
                            <i class="fas fa-chart-line fa-3x mb-3 text-primary"></i>
                            <h5 class="fw-bold">View Financials</h5>
                            <p class="small text-muted">Check reports & trends</p>
                            <a href="/analytics" class="btn btn-outline-primary w-100">Open Report</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body text-center d-flex flex-column justify-content-center">
                            <i class="fas fa-users fa-3x mb-3 text-success"></i>
                            <h5 class="fw-bold">Team Hub</h5>
                            <div th:if="${hasNewMessage}" class="badge bg-danger mb-2">New Messages!</div>
                            <div th:unless="${hasNewMessage}" class="text-muted small mb-2">All caught up</div>
                            <a href="/team" class="btn btn-outline-success w-100">Go to Chat</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
