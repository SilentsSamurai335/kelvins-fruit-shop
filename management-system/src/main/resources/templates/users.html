<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Staff - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        /* --- DARK MODE OVERRIDES --- */

        /* Fix Card Headers */
        [data-theme="dark"] .card-header {
            background-color: var(--card-bg);
            color: white;
            border-bottom: 1px solid #495057;
        }

        /* Fix Table Headers */
        [data-theme="dark"] .table thead th {
            background-color: #343a40;
            color: var(--ff-yellow);
            border-color: #495057;
        }

        /* Fix Input Fields */
        [data-theme="dark"] .form-control {
            background-color: #2c3034;
            color: white;
            border: 1px solid #495057;
        }
        [data-theme="dark"] .form-control::placeholder {
            color: #adb5bd;
        }

        /* Fix Badges */
        [data-theme="dark"] .badge.bg-light {
            background-color: #495057 !important; /* Make light badges grey */
            color: white !important;
            border-color: #6c757d !important;
        }
    </style>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='users')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <h2 class="fw-bold mb-4">👥 Manage Staff</h2>

            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0 fw-bold">Create New Account</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/save-user}" th:object="${newUser}" method="post" class="row g-3">
                        <div class="col-md-4">
                            <label class="fw-bold small opacity-75">Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. John Doe" required>
                        </div>
                        <div class="col-md-3">
                            <label class="fw-bold small opacity-75">Username</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="e.g. john" required>
                        </div>
                        <div class="col-md-3">
                            <label class="fw-bold small opacity-75">Password</label>
                            <input type="text" th:field="*{password}" class="form-control" placeholder="e.g. 1234" required>
                        </div>
                        <div class="col-md-2 align-self-end">
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Create</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="bg-light">
                        <tr>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${listUsers}">
                            <td th:text="${user.fullName}" class="fw-bold"></td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${user.username}"></span>
                            </td>
                            <td>
                                        <span th:text="${user.role}"
                                              th:class="${user.role == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-success'">
                                        </span>
                            </td>
                            <td>
                                <a th:if="${user.role != 'ADMIN'}"
                                   th:href="@{/delete-user/{id}(id=${user.id})}"
                                   class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
