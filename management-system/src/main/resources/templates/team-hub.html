<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Team Hub - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        /* Chat Bubble Styles that work in Dark Mode */
        .msg-me {
            background-color: var(--ff-yellow);
            color: black;
            border-bottom-right-radius: 0;
        }
        .msg-other {
            background-color: #e9ecef; /* Light Grey for Day */
            color: black;
            border-bottom-left-radius: 0;
        }

        /* Dark Mode Overrides for Chat */
        [data-theme="dark"] .msg-other {
            background-color: #343a40; /* Dark Grey for Night */
            color: white;
        }
        [data-theme="dark"] .card-header {
            color: white !important;
        }
        [data-theme="dark"] .text-dark {
            color: white !important;
        }
    </style>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='team')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-warning d-flex justify-content-between align-items-center">
                            <h5 class="fw-bold mb-0 text-dark">📌 Notice Board</h5>
                            <small class="text-dark opacity-75">Merits, Challenges & Updates</small>
                        </div>
                        <div class="card-body" style="max-height: 500px; overflow-y: auto;">

                            <form th:action="@{/team/send}" method="post" class="mb-4">
                                <input type="hidden" name="type" value="NOTICE">
                                <div class="input-group">
                                    <input type="text" name="content" class="form-control" placeholder="Post a daily update..." required>
                                    <button class="btn btn-dark">Post</button>
                                </div>
                            </form>

                            <div th:each="note : ${notices}" class="card mb-2 border-start border-4 border-warning">
                                <div class="card-body p-2">
                                    <div class="d-flex justify-content-between small text-muted">
                                        <strong th:text="${note.author}">Admin</strong>
                                        <span th:text="${#temporals.format(note.timestamp, 'dd-MM HH:mm')}">Time</span>
                                    </div>
                                    <p class="mb-0 mt-1" th:text="${note.content}">Update text</p>
                                </div>
                            </div>

                            <div th:if="${#lists.isEmpty(notices)}" class="text-center text-muted mt-5">
                                <p>No updates yet.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-dark text-white">
                            <h5 class="fw-bold mb-0">💬 Team Chat</h5>
                        </div>
                        <div class="card-body d-flex flex-column" style="height: 500px;">

                            <div class="flex-grow-1 overflow-auto mb-3 pe-2" id="chatArea" style="display: flex; flex-direction: column; gap: 10px;">
                                <div th:each="msg : ${chats}"
                                     class="p-2 rounded shadow-sm"
                                     th:classappend="${msg.author == #authentication.name} ? 'msg-me align-self-end text-end' : 'msg-other align-self-start'"
                                     style="max-width: 80%;">

                                    <small class="fw-bold d-block" style="font-size: 0.7em; opacity: 0.7;" th:text="${msg.author}">User</small>
                                    <div th:text="${msg.content}">Message</div>
                                    <small style="font-size: 0.6em; opacity: 0.5;" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}">10:00</small>
                                </div>
                            </div>

                            <form th:action="@{/team/send}" method="post">
                                <input type="hidden" name="type" value="CHAT">
                                <div class="input-group">
                                    <input type="text" name="content" class="form-control" placeholder="Type a message..." required>
                                    <button class="btn btn-success"><i class="fas fa-paper-plane"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    var chatArea = document.getElementById("chatArea");
    chatArea.scrollTop = chatArea.scrollHeight;
</script>
</body>
</html>
