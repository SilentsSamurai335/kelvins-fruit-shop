<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Team Hub - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
    <style>
        .hub-container { height: calc(100vh - 100px); min-height: 600px; }
        .chat-card { height: 100%; display: flex; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        .chat-sidebar { width: 280px; background: rgba(0,0,0,0.02); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .chat-window { flex: 1; display: flex; flex-direction: column; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }

        /* BUBBLES */
        .msg-bubble { max-width: 75%; padding: 10px 15px; border-radius: 15px; position: relative; }
        .msg-me { background: var(--ff-yellow); color: black; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: #e9ecef; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        [data-theme="dark"] .msg-other { background: #343a40; color: white; }

        /* DATE DIVIDER */
        .date-badge { text-align: center; margin: 15px 0; opacity: 0.7; }
        .date-badge span { background: rgba(0,0,0,0.1); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        [data-theme="dark"] .date-badge span { background: rgba(255,255,255,0.15); color: white; }

        .contact-item { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; text-decoration: none; color: var(--text-color); display: block; }
        .contact-item:hover { background: rgba(0,0,0,0.05); }
        .contact-item.active { background: var(--ff-yellow); color: black; font-weight: bold; }

        .notice-item { border-left: 4px solid var(--ff-yellow); background: var(--card-bg); transition: transform 0.2s; }
        .notice-item:hover { transform: translateX(5px); }

        /* DARK MODE TEXT FIXES (Crucial for Notices) */
        [data-theme="dark"] .notice-item strong { color: #f8f9fa !important; }
        [data-theme="dark"] .notice-item p { color: #e0e0e0 !important; }
        [data-theme="dark"] .notice-item small.text-muted { color: #adb5bd !important; }
        [data-theme="dark"] .notice-form-input { background-color: #2b2b2b !important; color: white !important; border: 1px solid #555 !important; }
    </style>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='team')}"></div>
    <div class="main-content">
        <div class="container-fluid h-100">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row g-4 hub-container">
                <div class="col-lg-8 h-100">
                    <div class="chat-card shadow-sm">
                        <div class="chat-sidebar" sec:authorize="hasRole('ADMIN')">
                            <div class="p-3 fw-bold bg-light text-dark border-bottom">Staff Members</div>
                            <div class="overflow-auto flex-grow-1">
                                <a th:each="staff : ${staffList}" th:href="@{/team(staff=${staff.username})}"
                                   class="contact-item" th:classappend="${chatTarget == staff.username} ? 'active'">
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="rounded-circle bg-secondary text-white d-flex justify-content-center align-items-center" style="width: 30px; height: 30px; font-size: 0.8rem;">
                                            <span th:text="${#strings.substring(staff.username,0,1)}">U</span>
                                        </div>
                                        <span th:text="${staff.fullName}">User</span>
                                    </div>
                                </a>
                            </div>
                        </div>

                        <div class="chat-window">
                            <div class="p-3 border-bottom bg-light text-dark fw-bold d-flex justify-content-between">
                                <span><i class="fas fa-comments text-warning"></i> <span th:text="${chatTarget}">Chat</span></span>
                                <small class="text-success"><i class="fas fa-circle" style="font-size: 8px;"></i> Online</small>
                            </div>

                            <div id="chatArea" class="chat-messages">
                                <div th:if="${#lists.isEmpty(chats)}" class="text-center text-muted mt-5">No messages yet.</div>

                                <th:block th:each="msg, iter : ${chats}">
                                    <th:block th:if="${msg.content != null and !msg.content.trim().isEmpty()}">
                                        <div class="date-badge"
                                             th:if="${iter.index == 0 or !#strings.equals(#temporals.format(msg.timestamp, 'yyyy-MM-dd'), #temporals.format(chats[iter.index-1].timestamp, 'yyyy-MM-dd'))}">
                                            <span th:text="${#temporals.format(msg.timestamp, 'EEEE, MMM d')}">Date</span>
                                        </div>

                                        <div class="msg-bubble shadow-sm"
                                             th:classappend="${msg.author == #authentication.name} ? 'msg-me' : 'msg-other'">
                                            <div th:text="${msg.content}">...</div>
                                            <div class="text-end opacity-50" style="font-size: 0.6rem;" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}"></div>
                                        </div>
                                    </th:block>
                                </th:block>
                            </div>

                            <div class="p-3 border-top" th:if="${currentRecipient != null && currentRecipient != ''}">
                                <form th:action="@{/save-chat}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="recipient" th:value="${currentRecipient}">
                                    <input type="text" name="content" class="form-control" placeholder="Type a message..." required autocomplete="off">
                                    <button class="btn btn-warning"><i class="fas fa-paper-plane"></i></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 h-100 d-flex flex-column">

                    <div sec:authorize="hasRole('ADMIN')">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/team(tab='active')}" class="btn" th:classappend="${param.tab == null or param.tab[0] == 'active'} ? 'btn-dark' : 'btn-outline-dark'">Active</a>
                                <a th:href="@{/team(tab='archived')}" class="btn" th:classappend="${param.tab != null and param.tab[0] == 'archived'} ? 'btn-dark' : 'btn-outline-dark'">Archived</a>
                            </div>
                            <button class="btn btn-sm btn-warning fw-bold text-dark" onclick="toggleNotice()">+ Post</button>
                        </div>

                        <div id="noticeActionBar" class="card shadow-sm border-0 mb-3 bg-dark text-white" style="display: none;">
                            <div class="card-body p-2 d-flex justify-content-between align-items-center">
                                <span class="small ms-2"><span id="selectedCount">0</span> selected</span>
                                <div class="btn-group btn-group-sm">
                                    <button th:if="${param.tab == null or param.tab[0] == 'active'}" class="btn btn-outline-light" onclick="submitAction('archive')"><i class="fas fa-archive"></i> Archive</button>
                                    <button th:if="${param.tab != null and param.tab[0] == 'archived'}" class="btn btn-outline-light" onclick="submitAction('unarchive')"><i class="fas fa-box-open"></i> Restore</button>
                                    <button class="btn btn-outline-danger" onclick="submitAction('delete')"><i class="fas fa-trash-alt"></i> Delete</button>
                                </div>
                            </div>
                        </div>

                        <div id="newNoticeForm" style="display: none;" class="card border-0 shadow-sm mb-3 bg-warning">
                            <div class="card-body p-3">
                                <form th:action="@{/save-update}" method="post">
                                    <input type="hidden" name="type" value="NOTICE">
                                    <input type="text" name="subject" class="form-control form-control-sm mb-2 fw-bold notice-form-input" placeholder="Subject" required>
                                    <textarea name="content" class="form-control form-control-sm mb-2 notice-form-input" rows="3" placeholder="Details..." required></textarea>
                                    <div class="text-end">
                                        <button type="button" class="btn btn-sm btn-light" onclick="toggleNotice()">Cancel</button>
                                        <button type="submit" class="btn btn-sm btn-dark">Post</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div sec:authorize="!hasRole('ADMIN')" class="mb-3">
                        <h4 class="fw-bold mb-0">📌 Notices</h4>
                    </div>

                    <div class="card shadow-sm border-0 flex-grow-1 overflow-hidden">
                        <div class="card-body p-0 overflow-auto" id="noticeArea">
                            <form id="noticeActionForm" th:action="@{/manage-notices}" method="post">
                                <input type="hidden" name="action" id="formActionType">

                                <div th:each="note : ${notices}">

                                    <div sec:authorize="hasRole('ADMIN')">
                                        <div th:if="${(param.tab == null or param.tab[0] == 'active') and !note.archived}" class="notice-item p-3 border-bottom d-flex gap-3 align-items-start">
                                            <div class="pt-1"><input type="checkbox" name="selectedIds" th:value="${note.id}" class="form-check-input notice-chk" onclick="updateActions()"></div>
                                            <div class="flex-grow-1">
                                                <div class="d-flex justify-content-between"><strong class="text-dark" th:text="${note.subject}"></strong><small class="text-muted" th:text="${#temporals.format(note.timestamp, 'MMM dd')}"></small></div>
                                                <p class="mb-1 text-secondary small" th:text="${note.content}"></p>
                                                <small class="text-primary fw-bold" th:text="${note.author}"></small>
                                            </div>
                                        </div>
                                        <div th:if="${param.tab != null and param.tab[0] == 'archived' and note.archived}" class="notice-item p-3 border-bottom d-flex gap-3 align-items-start">
                                            <div class="pt-1"><input type="checkbox" name="selectedIds" th:value="${note.id}" class="form-check-input notice-chk" onclick="updateActions()"></div>
                                            <div class="flex-grow-1">
                                                <div class="d-flex justify-content-between"><strong class="text-dark" th:text="${note.subject}"></strong><small class="text-muted" th:text="${#temporals.format(note.timestamp, 'MMM dd')}"></small></div>
                                                <p class="mb-1 text-secondary small" th:text="${note.content}"></p>
                                                <small class="text-primary fw-bold" th:text="${note.author}"></small>
                                            </div>
                                        </div>
                                    </div>

                                    <div sec:authorize="!hasRole('ADMIN')">
                                        <div th:if="${!note.archived}" class="notice-item p-3 border-bottom">
                                            <div class="d-flex justify-content-between"><strong class="text-dark" th:text="${note.subject}"></strong><small class="text-muted" th:text="${#temporals.format(note.timestamp, 'MMM dd')}"></small></div>
                                            <p class="mb-1 text-secondary small" th:text="${note.content}"></p>
                                            <small class="text-primary fw-bold" th:text="${note.author}"></small>
                                        </div>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Toggle New Post Form
    function toggleNotice() {
        var f = document.getElementById('newNoticeForm');
        f.style.display = (f.style.display === 'none') ? 'block' : 'none';
    }

    // 2. Action Bar Logic (Checkbox selection)
    function updateActions() {
        var count = document.querySelectorAll('.notice-chk:checked').length;
        document.getElementById('selectedCount').innerText = count;
        document.getElementById('noticeActionBar').style.display = (count > 0) ? 'block' : 'none';
    }

    // 3. Submit Archive/Delete
    function submitAction(type) {
        document.getElementById('formActionType').value = type;
        document.getElementById('noticeActionForm').submit();
    }

    // 4. Auto Refresh
    var chat = document.getElementById('chatArea');
    if(chat) chat.scrollTop = chat.scrollHeight;

    setInterval(function() {
        if (document.getElementById("chatArea")) {
            fetch(window.location.href)
                .then(response => response.text())
                .then(html => {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(html, 'text/html');

                    // Refresh Chat
                    var newChat = doc.getElementById("chatArea").innerHTML;
                    var currentChat = document.getElementById("chatArea");
                    if (currentChat.innerHTML.trim() !== newChat.trim()) {
                        currentChat.innerHTML = newChat;
                        currentChat.scrollTop = currentChat.scrollHeight;
                    }

                    // Refresh Notices (Only if not selecting items)
                    if (document.querySelectorAll('.notice-chk:checked').length === 0) {
                        var newNotices = doc.getElementById("noticeArea").innerHTML;
                        if (document.getElementById("noticeArea").innerHTML.trim() !== newNotices.trim()) {
                            document.getElementById("noticeArea").innerHTML = newNotices;
                        }
                    }
                });
        }
    }, 4000);
</script>
</body>
</html>
