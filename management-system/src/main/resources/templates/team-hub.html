<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Team Hub - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        /* --- CHAT BUBBLES --- */
        .msg-me { background-color: var(--ff-yellow); color: black; border-bottom-right-radius: 0; }
        .msg-other { background-color: #e9ecef; color: black; border-bottom-left-radius: 0; }

        /* --- DARK MODE OVERRIDES --- */
        [data-theme="dark"] .msg-other {
            background-color: #343a40; /* Dark Grey Bubble */
            color: white;
        }

        /* FIX: Top (Header) & Bottom (Footer) Backgrounds */
        [data-theme="dark"] .chat-header,
        [data-theme="dark"] .chat-footer {
            background-color: #1a1d20 !important; /* Very Dark / Black */
            border-color: #343a40 !important;
            color: white !important;
        }

        /* Fix Input Field in Dark Mode */
        [data-theme="dark"] .form-control {
            background-color: #2c3034;
            color: white;
            border: 1px solid #495057;
        }

        /* Sidebar List Items */
        [data-theme="dark"] .list-group-item {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        [data-theme="dark"] .list-group-item:hover { background-color: #343a40; }
        .contact-link.active { background-color: var(--ff-yellow) !important; color: black !important; }
    </style>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='team')}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row mb-4">
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-warning d-flex justify-content-between align-items-center">
                            <h5 class="fw-bold mb-0 text-dark">📌 Notice Board</h5>
                            <button class="btn btn-sm btn-dark" onclick="document.getElementById('noticeForm').style.display='block'">+ Post</button>
                        </div>
                        <div class="card-body" style="max-height: 200px; overflow-y: auto;">
                            <div id="noticeForm" style="display: none;" class="mb-3">
                                <form th:action="@{/save-update}" method="post" class="input-group">
                                    <input type="text" name="content" class="form-control" placeholder="Post a public update..." required>
                                    <button class="btn btn-dark">Post</button>
                                </form>
                            </div>
                            <div th:each="note : ${notices}" class="border-bottom pb-1 mb-1 small">
                                <strong th:text="${note.author}" class="text-primary"></strong>:
                                <span th:text="${note.content}"></span>
                                <span class="text-muted float-end" th:text="${#temporals.format(note.timestamp, 'dd-MM HH:mm')}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row" style="height: 500px;">

                <div class="col-md-4 h-100" sec:authorize="hasRole('ADMIN')">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-header chat-header bg-dark text-white">Select Staff</div>
                        <div class="list-group list-group-flush overflow-auto h-100">
                            <a th:each="staff : ${staffList}"
                               th:href="@{/team(staff=${staff.username})}"
                               class="list-group-item list-group-item-action contact-link"
                               th:classappend="${chatTarget == staff.username} ? 'active'">
                                <i class="fas fa-user-circle me-2"></i>
                                <span th:text="${staff.fullName}">John</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="h-100" th:classappend="${#authorization.expression('hasRole(''ADMIN'')')} ? 'col-md-8' : 'col-12'">
                    <div class="card h-100 shadow-sm border-0">

                        <div class="card-header chat-header border-bottom fw-bold d-flex align-items-center">
                            <i class="fas fa-comments text-warning me-2"></i>
                            <span>Chatting with: <span class="text-primary" th:text="${chatTarget}">User</span></span>
                        </div>

                        <div class="card-body d-flex flex-column p-0"> <div id="chatArea" class="flex-grow-1 overflow-auto p-3 d-flex flex-column gap-2">
                            <div th:if="${#lists.isEmpty(chats)}" class="text-center text-muted mt-5">
                                <p>No messages yet. Say hello! 👋</p>
                            </div>
                            <div th:each="msg : ${chats}"
                                 class="p-2 rounded shadow-sm"
                                 th:classappend="${msg.author == #authentication.name} ? 'msg-me align-self-end text-end' : 'msg-other align-self-start'"
                                 style="max-width: 75%;">
                                <div th:text="${msg.content}">Hello</div>
                                <small style="font-size: 0.6em; opacity: 0.6;" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}"></small>
                            </div>
                        </div>

                            <div class="card-footer chat-footer border-top p-3" th:if="${currentRecipient != null && currentRecipient != ''}">
                                <form th:action="@{/save-chat}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="recipient" th:value="${currentRecipient}">
                                    <input type="text" name="content" class="form-control" placeholder="Type a message..." required autocomplete="off">
                                    <button class="btn btn-success"><i class="fas fa-paper-plane"></i></button>
                                </form>
                            </div>
                            <div th:if="${currentRecipient == '' && #authorization.expression('hasRole(''ADMIN'')')}" class="text-center text-muted p-3">
                                <i class="fas fa-arrow-left"></i> Select a staff member.
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<script>
    var chatArea = document.getElementById("chatArea");
    if(chatArea) chatArea.scrollTop = chatArea.scrollHeight;
</script>
</body>
</html>
