<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='inventory')}"></div>

    <div class="main-content w-100">
        <div class="container-fluid p-4">
            <div th:replace="~{fragments :: topbar}"></div>

            <div class="row">
                <div class="col-md-8">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold">🥤 Menu</h2>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a href="/add-product" class="btn btn-outline-primary btn-sm">+ New Product</a>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th>Item</th>
                                    <th>Price</th>
                                    <th>Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="product : ${listProducts}">
                                    <td>
                                        <div class="fw-bold" th:text="${product.name}"></div>
                                        <span class="badge bg-light text-dark border" th:text="${product.category}"></span>
                                    </td>

                                    <td>
                                        <div th:if="${product.category == 'Beverage'}" class="small text-muted">
                                            <div>250ml: <span th:text="${product.priceSmall}"></span></div>
                                            <div>500ml: <span th:text="${product.priceLarge}"></span></div>
                                        </div>
                                        <div th:unless="${product.category == 'Beverage'}">
                                            <span class="fw-bold text-success" th:text="${product.priceSmall}"></span>
                                            <div class="small" th:classappend="${product.stockSmall < 5} ? 'text-danger' : 'text-muted'"
                                                 th:text="'Stock: ' + ${product.stockSmall}"></div>
                                        </div>

                                        <div th:if="${product.category == 'Snack' and #authentication.name == 'Kelvin'}" class="mt-2">
                                            <form th:action="@{/add-stock}" method="post" class="d-flex gap-2">
                                                <input type="hidden" name="productId" th:value="${product.id}">
                                                <input type="number" name="quantity" class="form-control form-control-sm" placeholder="Qty" min="1" required style="width: 70px;">
                                                <button type="submit" class="btn btn-sm btn-success fw-bold">
                                                    <i class="fas fa-plus"></i> Stock
                                                </button>
                                            </form>
                                        </div>

                                        <a th:href="@{/products/edit/{id}(id=${product.id})}"
                                           class="btn btn-sm btn-outline-primary"
                                           th:if="${#authentication != null and #authentication.name == 'Kelvin'}">
                                            <i class="fas fa-pencil-alt"></i>
                                        </a>

                                        <a th:href="@{/inventory/delete/{id}(id=${product.id})}"
                                           class="btn btn-sm btn-outline-danger mt-2"
                                           th:if="${#authentication != null and #authentication.name == 'Kelvin'}"
                                           onclick="return confirm('WARNING: Are you sure you want to permanently delete this product from the menu?');">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </td>

                                    <td>
                                        <div th:if="${product.category == 'Beverage'}" class="d-flex flex-column gap-2">
                                            <div class="d-flex gap-1">
                                                <select class="form-select form-select-sm" style="width: 80px;" th:id="'size-' + ${product.id}">
                                                    <option value="250ml">250ml</option>
                                                    <option value="300ml">300ml</option>
                                                    <option value="500ml">500ml</option>
                                                    <option value="Custom" class="fw-bold text-primary">Custom?</option>
                                                </select>

                                                <input type="number" value="1" min="1" class="form-control form-control-sm" style="width: 50px;" th:id="'qty-bev-' + ${product.id}">

                                                <button class="btn btn-primary btn-sm fw-bold"
                                                        th:onclick="addBeverageToCart([[${product.id}]], [[${product.name}]], [[${product.priceSmall}]], [[${product.priceLarge}]])">
                                                    Add
                                                </button>
                                            </div>

                                            <button class="btn btn-dark w-100 btn-sm"
                                                    th:onclick="openMixModal([[${product.id}]], [[${product.name}]], [[${product.priceSmall}]], [[${product.priceLarge}]])">
                                                Create Mix
                                            </button>
                                        </div>

                                        <div th:unless="${product.category == 'Beverage'}" class="d-flex gap-2">
                                            <input type="number" value="1" min="1" class="form-control form-control-sm"
                                                   style="width: 60px;" th:id="'qty-' + ${product.id}">

                                            <button class="btn btn-success btn-sm fw-bold"
                                                    th:onclick="addToCartWithQty([[${product.id}]], [[${product.name}]], [[${product.priceSmall}]])">
                                                Add
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow border-0 sticky-top" style="top: 20px;">
                        <div class="card-header bg-warning text-dark fw-bold">
                            🛒 Current Order
                        </div>

                        <div class="card-body p-0">
                            <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                                <table class="table table-sm table-hover mb-0 align-middle">
                                    <thead>
                                    <tr>
                                        <th>Item</th>
                                        <th>Qty</th>
                                        <th>Total</th>
                                        <th></th>
                                    </tr>
                                    </thead>
                                    <tbody id="cartItems">
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="card-footer" style="border-top: 1px solid var(--border-color);">
                            <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                                <span>Total:</span>
                                <span>KES <span id="cartTotal">0</span></span>
                            </div>

                            <div class="mb-3">
                                <label class="small text-muted">Payment Method</label>
                                <select id="paymentMethod" class="form-select">
                                    <option value="MPESA">M-Pesa</option>
                                    <option value="CASH">Cash</option>
                                </select>
                            </div>

                            <!-- Visible ONLY to Admins -->
                            <div class="mb-3" sec:authorize="hasRole('ADMIN')">
                                <label for="manualDate" class="form-label fw-bold">Transaction Date</label>
                                <input type="date" id="manualDate" name="manualDate" class="form-control"
                                       th:max="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                       th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                            </div>

                            <!-- Fallback for cashiers -->
                            <input type="hidden" name="manualDate"
                                   th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                   sec:authorize="!hasRole('ADMIN')">

                            <button id="payButton" onclick="processPayment()" class="btn btn-success w-100 py-2 fw-bold">
                                COMPLETE SALE
                            </button>
                        </div>


                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="mixModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">🍹 Create Custom Mix</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="mixBaseId">
                        <input type="hidden" id="mixBaseName">

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Base Flavor</label>
                            <input type="text" id="mixBaseDisplay" class="form-control bg-secondary text-white fw-bold border-0" readonly>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label fw-bold mb-0 small text-uppercase">Mix With:</label>
                                <button type="button" class="btn btn-sm btn-warning fw-bold" onclick="addMixinRow()">+ Add Flavor</button>
                            </div>
                            <div id="mixinsContainer"></div>
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label fw-bold small">Size</label>
                                <select id="mixSize" class="form-select" onchange="updateMixPrice()">
                                    <option value="250">250ml</option>
                                    <option value="500">500ml</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold small">Quantity</label>
                                <input type="number" id="mixQty" class="form-control" value="1" min="1" onchange="updateMixPrice()">
                            </div>
                        </div>

                        <div class="mt-4 p-3 rounded bg-dark bg-opacity-10 text-center border">
                            <small class="text-muted d-block small">TOTAL COST</small>
                            <h3 class="fw-bold text-yellow mb-0" id="mixTotalPrice">KES 0</h3>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-success fw-bold w-100" onclick="submitMix()">Add to Order</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="juiceOptionTemplate" style="display:none;">
            <option value="">Select a juice...</option>
            <th:block th:each="p : ${listProducts}">
                <option th:if="${p.category == 'Beverage'}"
                        th:value="${p.name}"
                        th:text="${p.name}"></option>
            </th:block>
        </div>

    </div>
</div>

<script>
    // 1. CORE CART LOGIC
    let cart = [];

    function addToCart(id, name, price) {
        let existing = cart.find(item => item.name === name);
        if (existing) {
            existing.qty++;
        } else {
            cart.push({ id: id, name: name, price: price, qty: 1 });
        }
        updateCartUI();
    }

    // HELPER FOR NON-BEVERAGES
    function addToCartWithQty(id, name, price) {
        let qtyInput = document.getElementById('qty-' + id);
        let qty = parseInt(qtyInput.value) || 1;

        let existing = cart.find(item => item.name === name);
        if (existing) {
            existing.qty += qty;
        } else {
            cart.push({ id: id, name: name, price: price, qty: qty });
        }
        updateCartUI();
        qtyInput.value = 1;
    }

    // BEVERAGE FUNCTION (Handles sizes & custom pricing)
    function addBeverageToCart(id, name, priceSm, priceLg) {
        let sizeSelect = document.getElementById("size-" + id);
        let size = sizeSelect.value;
        let qtyInput = document.getElementById("qty-bev-" + id);
        let qty = parseInt(qtyInput.value) || 1;

        if (size === "Custom") {
            let customName = prompt("Size Name:");
            if (!customName) return;
            let customPrice = prompt("Price:");
            if (!customPrice) return;

            addToCartWithQtyValue(id, name + " (" + customName + ")", parseFloat(customPrice), qty);
            return;
        }

        let finalPrice = (size === "250ml") ? priceSm : priceLg;
        let finalName = name + " (" + size + ")";

        addToCartWithQtyValue(id, finalName, finalPrice, qty);
        qtyInput.value = 1;
    }

    function updateCartUI() {
        let tbody = document.getElementById("cartItems");
        let totalSpan = document.getElementById("cartTotal");

        tbody.innerHTML = "";
        let total = 0;

        cart.forEach((item, index) => {
            let itemTotal = item.price * item.qty;
            total += itemTotal;
            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.qty}</td>
                    <td>${itemTotal}</td>
                    <td><button onclick="removeFromCart(${index})" class="btn btn-danger btn-sm p-0 px-1">×</button></td>
                </tr>
            `;
        });
        totalSpan.innerText = total;
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    // 2. MODAL LOGIC FOR MIXED JUICES
    function openMixModal(id, name, price250, price500) {
        document.getElementById('mixBaseId').value = id;
        document.getElementById('mixBaseName').value = name;
        document.getElementById('mixBaseDisplay').value = name;

        const modal = document.getElementById('mixModal');
        modal.dataset.p250 = price250;
        modal.dataset.p500 = price500;

        document.getElementById('mixQty').value = 1;
        document.getElementById('mixSize').value = "250";

        document.getElementById('mixinsContainer').innerHTML = '';
        addMixinRow();

        updateMixPrice();
        new bootstrap.Modal(modal).show();
    }

    function addMixinRow() {
        const container = document.getElementById('mixinsContainer');
        const options = document.getElementById('juiceOptionTemplate').innerHTML;

        const row = document.createElement('div');
        row.className = 'input-group mb-2 mixin-row';
        row.innerHTML = `
            <select class="form-select mixin-select">${options}</select>
            <button type="button" class="btn btn-outline-danger" onclick="this.parentElement.remove()">
                <i class="fas fa-times"></i>
            </button>
        `;
        container.appendChild(row);
    }

    function updateMixPrice() {
        const modal = document.getElementById('mixModal');
        const size = document.getElementById('mixSize').value;
        const qty = parseInt(document.getElementById('mixQty').value) || 1;

        let unitPrice = (size === "500") ? parseFloat(modal.dataset.p500) : parseFloat(modal.dataset.p250);
        let total = unitPrice * qty;

        document.getElementById('mixTotalPrice').innerText = "KES " + total.toLocaleString();
    }

    function submitMix() {
        const baseId = document.getElementById('mixBaseId').value;
        const baseName = document.getElementById('mixBaseName').value;
        const size = document.getElementById('mixSize').value;
        const qty = parseInt(document.getElementById('mixQty').value) || 1;

        const selects = document.querySelectorAll('.mixin-select');
        let mixins = [];
        selects.forEach(s => { if(s.value) mixins.push(s.value); });

        let finalName = baseName + " (" + size + "ml)";
        if(mixins.length > 0) finalName += " w/ " + mixins.join(" & ");

        const modal = document.getElementById('mixModal');
        let unitPrice = (size === "500") ? parseFloat(modal.dataset.p500) : parseFloat(modal.dataset.p250);

        addToCartWithQtyValue(baseId, finalName, unitPrice, qty);
        bootstrap.Modal.getInstance(document.getElementById('mixModal')).hide();
    }

    // SHARED HELPER FUNCTION
    function addToCartWithQtyValue(id, name, price, qtyToAdd) {
        let existing = cart.find(item => item.name === name);
        if (existing) {
            existing.qty += qtyToAdd;
        } else {
            cart.push({ id: id, name: name, price: price, qty: qtyToAdd });
        }
        updateCartUI();
    }

    // 3. PAYMENT LOGIC
    async function processPayment() {
        if (cart.length === 0) { alert("Cart is empty"); return; }

        let payBtn = document.getElementById("payButton");
        let method = document.getElementById("paymentMethod").value;
        let total = parseFloat(document.getElementById("cartTotal").innerText);

        // 1. You grabbed the date perfectly here!
        let manualDateInput = document.getElementById('manualDate');
        let manualDate = manualDateInput ? manualDateInput.value : '';

        payBtn.innerText = "Recording Sale...";
        payBtn.disabled = true;

        try {
            let saveRes = await fetch("/api/sales/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    paymentMethod: method,
                    amount: total,
                    items: cart,
                    manualDate: manualDate // 2. ADD THIS LINE to send it to Java!
                })
            });

            let result = await saveRes.json();

            if (saveRes.ok) {
                alert("SALE COMPLETE!");
                cart = [];
                updateCartUI();
            } else {
                alert("Error: " + (result.error || "Could not save sale"));
            }
        } catch (e) {
            console.error(e);
            alert("Network Error. Check console.");
        } finally {
            payBtn.innerText = "COMPLETE SALE";
            payBtn.disabled = false;
        }
    }
</script>
</body>
</html>
