<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Inventory - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='inventory')}"></div>
    <div class="card mb-3 border-0 shadow-sm">
        <div class="card-body">
            <input type="text" id="searchInput" onkeyup="filterTable()" class="form-control" placeholder="🔍 Search for beverage name (e.g. 'Mango')...">
        </div>
    </div>

    <script>
        function filterTable() {
            var input, filter, table, tr, td, i, txtValue;
            input = document.getElementById("searchInput");
            filter = input.value.toUpperCase();
            table = document.querySelector(".table");
            tr = table.getElementsByTagName("tr");

            for (i = 1; i < tr.length; i++) {
                // Check the Name column (index 1)
                td = tr[i].getElementsByTagName("td")[1];
                if (td) {
                    txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }
    </script>
    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <h2 class="fw-bold mb-4">🥤 Inventory & Point of Sale</h2>

            <div class="mb-3">
                <a href="/add-product" class="btn btn-primary"> + Add New Beverage</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Pricing</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product : ${listProducts}">

                            <td>
                                <span th:text="${product.name}" class="fw-bold">Name</span><br>
                                <span class="badge bg-light text-dark border" th:text="${product.category}">Type</span>
                            </td>

                            <td th:text="${product.description}" class="text-muted small">Desc</td>

                            <td>
                                <div th:if="${product.category == 'Beverage'}">
                                    <div class="small">Sm: <span class="fw-bold" th:text="${product.priceSmall}"></span></div>
                                    <div class="small">Lg: <span class="fw-bold" th:text="${product.priceLarge}"></span></div>
                                </div>
                                <div th:unless="${product.category == 'Beverage'}">
                                    <span class="fw-bold text-success" th:text="'KES ' + ${product.priceSmall}"></span>
                                </div>
                            </td>

                            <td>
                                <div th:if="${product.category == 'Beverage'}">
                                    <span class="badge bg-success">Unlimited</span>
                                </div>
                                <div th:unless="${product.category == 'Beverage'}">
                    <span th:class="${product.stockSmall < 5} ? 'badge bg-danger' : 'badge bg-secondary'"
                          th:text="${product.stockSmall}">
                    </span>
                                </div>
                            </td>

                            <td>
                                <form th:if="${product.category == 'Beverage'}" th:action="@{/sell/{id}(id=${product.id})}" method="get" class="d-flex gap-2">
                                    <select name="size" class="form-select form-select-sm" style="width: 80px;">
                                        <option value="250ml">Sm</option>
                                        <option value="500ml">Lg</option>
                                    </select>
                                    <button type="submit" class="btn btn-success btn-sm">Sell</button>
                                </form>

                                <div th:unless="${product.category == 'Beverage'}">
                                    <a th:if="${product.stockSmall > 0}"
                                       th:href="@{/sell/{id}(id=${product.id})}"
                                       class="btn btn-success btn-sm w-100">Sell 1</a>

                                    <span th:unless="${product.stockSmall > 0}" class="badge bg-danger p-1">Empty</span>
                                </div>

                                <div class="mt-2" sec:authorize="hasRole('ADMIN')">
                                    <a th:href="@{/delete/{id}(id=${product.id})}" class="text-danger small text-decoration-none">Delete</a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
