<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Inventory - Fruity Fusion</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments :: sidebar(activePage='inventory')}"></div>
    <div class="card mb-3 border-0 shadow-sm">
        <div class="card-body">
            <input type="text" id="searchInput" onkeyup="filterTable()" class="form-control" placeholder="🔍 Search for juice name (e.g. 'Mango')...">
        </div>
    </div>

    <script>
        function filterTable() {
            var input, filter, table, tr, td, i, txtValue;
            input = document.getElementById("searchInput");
            filter = input.value.toUpperCase();
            table = document.querySelector(".table");
            tr = table.getElementsByTagName("tr");

            for (i = 1; i < tr.length; i++) {
                // Check the Name column (index 1)
                td = tr[i].getElementsByTagName("td")[1];
                if (td) {
                    txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }
    </script>
    <div class="main-content">
        <div class="container-fluid">
            <div th:replace="~{fragments :: topbar}"></div>

            <h2 class="fw-bold mb-4">🥤 Inventory & Point of Sale</h2>

            <div class="mb-3">
                <a href="/add-product" class="btn btn-primary"> + Add New Juice</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Prices (Sm / Lg)</th> <th>Stock (Sm / Lg)</th>  <th>Sell / Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product : ${listProducts}">
                            <td th:text="${product.name}" class="fw-bold">Mango</td>
                            <td th:text="${product.description}" class="text-muted small">Desc</td>

                            <td>
                                <div class="small">
                                    🥤 250ml: <span class="fw-bold" th:text="${product.priceSmall}">100</span>
                                </div>
                                <div class="small">
                                    🥤 500ml: <span class="fw-bold" th:text="${product.priceLarge}">200</span>
                                </div>
                            </td>

                            <td>
                                <div class="small mb-1">
                                    <span class="text-muted">250ml: </span>
                                    <span th:text="${product.stockSmall}"
                                          th:class="${product.stockSmall < 5} ? 'badge bg-danger' : 'badge bg-secondary'">
                    </span>
                                </div>
                                <div class="small">
                                    <span class="text-muted">500ml: </span>
                                    <span th:text="${product.stockLarge}"
                                          th:class="${product.stockLarge < 5} ? 'badge bg-danger' : 'badge bg-secondary'">
                    </span>
                                </div>
                            </td>

                            <td>
                                <form th:action="@{/sell/{id}(id=${product.id})}" method="get" class="d-flex align-items-center gap-2">

                                    <select name="size" class="form-select form-select-sm" style="width: 100px;">
                                        <option value="250ml">250ml</option>
                                        <option value="500ml">500ml</option>
                                    </select>

                                    <button type="submit" class="btn btn-success btn-sm fw-bold">Sell</button>

                                </form>

                                <div class="mt-2" sec:authorize="hasRole('ADMIN')">
                                    <a th:href="@{/delete/{id}(id=${product.id})}" class="text-danger small text-decoration-none">Delete Product</a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
